        let currentChapter = 1;
        let currentPage = 1;

        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        function updateHashSilently(chap, page) {
            const newHash = '#' + chap + ':' + page;
            if (location.hash !== newHash) {
                history.replaceState(null, '', newHash);
            }
        }

        function downloadBookPDF() {
            const printArea = document.getElementById('print-area');
            const author = "Furkan Selim Kucukaslan";
            const t = uiStrings[uiLang] || uiStrings.en;

            let html = `
                <div class="print-title-page">
                    <img src="https://kitabalfurqan.github.io/furqan.png" alt="Kitab Al-Furqan" class="print-title-image">
                    <h1>Kitab Al-Furqan</h1>
                    <p class="print-author">${t.byAuthor} ${author}</p>
                </div>
                <div class="print-toc-page">
                    <h2>${t.tableOfContents}</h2>
            `;

            Object.keys(bookData).forEach(function(chapNum) {
                html += `<div class="print-toc-item">${chapNum}. ${bookData[chapNum].title}</div>`;
            });

            html += `</div>`;

            Object.keys(bookData).forEach(function(chapNum) {
                const chapter = bookData[chapNum];
                html += `<div class="print-chapter-title">${chapter.title}</div>`;
                html += `<div class="print-basmala">﷽</div>`;

                Object.keys(chapter.pages).forEach(function(pgNum) {
                    const passage = chapter.pages[pgNum];
                    if (!passage.en) return;
                    html += `
                        <div class="print-passage">
                            <div class="print-ref">${chapNum}:${pgNum}</div>
                            <div class="print-ar">${toArabicDigits(passage.ar)}</div>
                            <div class="print-en">${getTranslationText(passage)}</div>
                        </div>
                    `;
                });
            });

            printArea.innerHTML = html;
            document.title = 'Kitab Al-Furqan - Full Book';
            window.print();
        }

        function sharePage() {
            const url = location.origin + location.pathname + '#' + currentChapter + ':' + currentPage;
            const t = uiStrings[uiLang] || uiStrings.en;
            const isMobile = window.matchMedia('(max-width: 768px)').matches;

            if (isMobile && navigator.share) {
                navigator.share({ url: url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => alert(t.copied));
            } else {
                prompt("Copy link:", url);
            }
        }

        function loadFromHash() {
            const hash = location.hash.replace('#', '');
            const parts = hash.split(':');
            if (parts.length === 2) {
                const chap = parseInt(parts[0]);
                const pg = parseInt(parts[1]);
                if (bookData[chap] && bookData[chap].pages[pg]) {
                    currentChapter = chap;
                    currentPage = pg;
                    return true;
                }
            }
            return false;
        }

        const supportedContentLangs = ['en', 'tr', 'de'];
        const supportedUILangs = ['en', 'tr', 'de', 'ar'];
        const rawLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
        const userLang = supportedContentLangs.includes(rawLang) ? rawLang : 'en';
        const uiLang = supportedUILangs.includes(rawLang) ? rawLang : 'en';

        function getTranslationText(passage) {
            return passage[userLang] || passage.en;
        }

        function toArabicDigits(str) {
            if (!str) return str;
            const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return str.replace(/[0-9]/g, d => arabicDigits[d]);
        }

        const uiStrings = {
            en: { tagline: "Book of Proof", goTo: "Go to:", go: "Go", previous: "Previous", next: "Next", share: "Share", copied: "Link copied!", notFound: "Reference not found! Use format Chapter:Page (e.g. 1:2 or 2:1)", homeText: "An Islamic book exploring the evidences and arguments for the faith. Browse chapters from the menu, or press \"Start Reading\" to begin from the first page.", homeBtn: "Start Reading", searchPlaceholder: "Search a word or chapter...", noResults: "No results found.", chapterMatch: "Chapter match:", byAuthor: "By", tableOfContents: "Table of Contents" },
            tr: { tagline: "Delil Kitabı", goTo: "Git:", go: "Git", previous: "Önceki", next: "Sonraki", share: "Paylaş", copied: "Bağlantı kopyalandı!", notFound: "Referans bulunamadı! Bölüm:Sayfa biçimini kullanın (örn. 1:2 veya 2:1)", homeText: "İmana dair delilleri ve argümanları inceleyen İslami bir kitap. Menüden bölümlere göz atabilir veya ilk sayfadan başlamak için \"Okumaya Başla\" düğmesine basabilirsiniz.", homeBtn: "Okumaya Başla", searchPlaceholder: "Bir kelime veya bölüm ara...", noResults: "Sonuç bulunamadı.", chapterMatch: "Bölüm eşleşmesi:", byAuthor: "Yazar", tableOfContents: "İçindekiler" },
            de: { tagline: "Buch des Beweises", goTo: "Gehe zu:", go: "Los", previous: "Zurück", next: "Weiter", share: "Teilen", copied: "Link kopiert!", notFound: "Referenz nicht gefunden! Verwenden Sie das Format Kapitel:Seite (z. B. 1:2 oder 2:1)", homeText: "Ein islamisches Buch, das die Beweise und Argumente für den Glauben untersucht. Durchsuchen Sie die Kapitel über das Menü oder klicken Sie auf \"Lesen beginnen\", um auf der ersten Seite zu starten.", homeBtn: "Lesen beginnen", searchPlaceholder: "Ein Wort oder Kapitel suchen...", noResults: "Keine Ergebnisse gefunden.", chapterMatch: "Kapitelübereinstimmung:", byAuthor: "Von", tableOfContents: "Inhaltsverzeichnis" },

        function applyUILanguage() {
            const t = uiStrings[uiLang] || uiStrings.en;
            document.getElementById('tagline-text').innerText = t.tagline;
            document.getElementById('goto-label').innerText = t.goTo;
            document.getElementById('go-btn').innerText = t.go;
            document.getElementById('prev-btn').innerText = t.previous;
            document.getElementById('next-btn').innerText = t.next;
            document.getElementById('home-tagline-text').innerText = t.tagline;
            document.getElementById('home-text').innerText = t.homeText;
            document.getElementById('home-start-btn').innerText = t.homeBtn;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
        }

        function renderPage() {
            const chapter = bookData[currentChapter];
            const passage = chapter.pages[currentPage];

            document.getElementById('current-title').innerText = chapter.title;
            
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div class="chapter-header">
                    <h2>${chapter.title}</h2>
                    <p class="basmala">﷽</p>
                </div>
                <div class="passage">
                    <span class="passage-ref">${currentChapter}:${currentPage}</span>
                    <div class="passage-text">
                        <p class="passage-ar">${toArabicDigits(passage.ar)}</p>
                        <p class="passage-en">${getTranslationText(passage)}</p>
                    </div>
                </div>
            `;

            document.getElementById('page-display').innerText = `${currentChapter}:${currentPage}`;
            updateHashSilently(currentChapter, currentPage);

            // Update sidebar active buttons
            const buttons = document.querySelectorAll('.chapter-list button');
            buttons.forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === currentChapter);
            });

            // Update pagination buttons state
            const totalPages = Object.keys(chapter.pages).length;
            document.getElementById('prev-btn').disabled = (currentPage === 1 && currentChapter === 1);
            document.getElementById('next-btn').disabled = (currentPage === totalPages && !bookData[currentChapter + 1]);
        }

        function loadChapter(chapNum) {
            if (bookData[chapNum]) {
                currentChapter = chapNum;
                currentPage = 1;
                showReaderView();
                renderPage();
            }
        }

        function nextPage() {
            const totalPages = Object.keys(bookData[currentChapter].pages).length;
            if (currentPage < totalPages) {
                currentPage++;
            } else if (bookData[currentChapter + 1]) {
                currentChapter++;
                currentPage = 1;
            }
            renderPage();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
            } else if (currentChapter > 1) {
                currentChapter--;
                currentPage = Object.keys(bookData[currentChapter].pages).length;
            }
            renderPage();
        }

        function jumpToReference() {
            const val = document.getElementById('jump-input').value.trim();
            const parts = val.split(':');
            
            if (parts.length === 2) {
                const chap = parseInt(parts[0]);
                const pg = parseInt(parts[1]);

                if (bookData[chap] && bookData[chap].pages[pg] && bookData[chap].pages[pg].en) {
                    currentChapter = chap;
                    currentPage = pg;
                    renderPage();
                    document.getElementById('jump-input').value = '';
                    return;
                }
            }
            alert((uiStrings[uiLang] || uiStrings.en).notFound);
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function makeSnippet(text, query) {
            const lowerText = text.toLowerCase();
            const idx = lowerText.indexOf(query);
            const start = Math.max(0, idx - 40);
            const end = Math.min(text.length, idx + query.length + 40);
            let snippet = text.substring(start, end);
            if (start > 0) snippet = '...' + snippet;
            if (end < text.length) snippet = snippet + '...';
            const regex = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
            return snippet.replace(regex, '<mark>$1</mark>');
        }

        function performSearch() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('search-results');

            if (!query) {
                resultsContainer.classList.add('hidden');
                resultsContainer.innerHTML = '';
                return;
            }

            const matches = [];
            const langs = [userLang, 'en', 'ar', 'tr', 'de'].filter((lang, idx, arr) => arr.indexOf(lang) === idx);

            Object.keys(bookData).forEach(function(chapNum) {
                const chapter = bookData[chapNum];

                if (chapter.title.toLowerCase().includes(query)) {
                    const t = uiStrings[uiLang] || uiStrings.en;
                    matches.push({
                        chapter: chapNum,
                        page: 1,
                        snippet: '<strong>' + t.chapterMatch + '</strong> ' + chapter.title
                    });
                }

                Object.keys(chapter.pages).forEach(function(pgNum) {
                    const passage = chapter.pages[pgNum];
                    for (let i = 0; i < langs.length; i++) {
                        const text = passage[langs[i]];
                        if (text && text.toLowerCase().includes(query)) {
                            matches.push({
                                chapter: chapNum,
                                page: pgNum,
                                snippet: makeSnippet(text, query)
                            });
                            break;
                        }
                    }
                });
            });

            if (matches.length === 0) {
                const t = uiStrings[uiLang] || uiStrings.en;
                resultsContainer.innerHTML = '<p class="search-no-results">' + t.noResults + '</p>';
                resultsContainer.classList.remove('hidden');
                return;
            }

            let html = '';
            matches.forEach(function(m) {
                const chapterTitle = bookData[m.chapter].title;
                html += `
                    <div class="search-result-item" onclick="goToSearchResult(${m.chapter}, ${m.page})">
                        <span class="search-result-ref">${m.chapter}:${m.page}</span>
                        <span class="search-result-chapter">${chapterTitle}</span>
                        <p class="search-result-snippet">${m.snippet}</p>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
            resultsContainer.classList.remove('hidden');
        }

        function goToSearchResult(chap, page) {
            currentChapter = chap;
            currentPage = page;
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').classList.add('hidden');
            document.getElementById('search-results').innerHTML = '';
            showReaderView();
            renderPage();
        }

        function showHomePage() {
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('reader-view').classList.add('hidden');
            document.querySelectorAll('.chapter-list button').forEach(function(btn) {
                btn.classList.remove('active');
            });
        }

        function showReaderView() {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('reader-view').classList.remove('hidden');
        }

        function startReading() {
            currentChapter = 1;
            currentPage = 1;
            showReaderView();
            renderPage();
        }

        // Initialize display on load
        applyUILanguage();
        if (loadFromHash()) {
            showReaderView();
            renderPage();
        } else {
            showHomePage();
        }
        window.addEventListener('hashchange', function() {
            if (loadFromHash()) {
                showReaderView();
                renderPage();
            } else if (!location.hash) {
                showHomePage();
            }
        });
    </script>
