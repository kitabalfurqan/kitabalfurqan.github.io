<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <title>Kitab Al-Furqan</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --sidebar-bg: #ffffff;
            --text-color: #2b2b2b;
            --accent-color: #1b4332;
            --accent-light: #2d6a4f;
            --border-color: #e0e0e0;
            --tag-bg: #e8f5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            padding: 20px;
            background-color: var(--accent-color);
            color: #ffffff;
            text-align: center;
        }

        .brand h1 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .brand p {
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
        }

        .chapter-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .chapter-item {
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-item button {
            width: 100%;
            text-align: left;
            padding: 15px 20px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, color 0.2s;
        }

        .chapter-item button:hover,
        .chapter-item button.active {
            background-color: #f0f4f1;
            color: var(--accent-light);
            font-weight: bold;
        }

        /* Main Reader Panel */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-nav {
            background-color: #ffffff;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-controls input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 90px;
            font-size: 0.9rem;
            text-align: center;
        }

        .nav-controls button, .btn-page {
            padding: 8px 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .nav-controls button:hover, .btn-page:hover {
            background-color: var(--accent-light);
        }

        .reader-container {
            max-width: 750px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
        }

        .chapter-header h2 {
            font-size: 2rem;
            color: var(--accent-color);
        }

        .basmala {
            font-family: 'Scheherazade New', 'Noto Naskh Arabic', 'Traditional Arabic', serif;
            direction: rtl;
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-light);
            margin-top: 12px;
            line-height: 1.4;
        }

        /* Verse / Page Passage Layout */
        .passage {
            display: flex;
            margin-bottom: 25px;
            line-height: 1.8;
            font-size: 1.15rem;
        }

        .passage-ref {
            font-family: sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-light);
            background-color: var(--tag-bg);
            padding: 4px 8px;
            border-radius: 4px;
            height: fit-content;
            margin-right: 15px;
            user-select: none;
        }

        .passage-text {
            flex-grow: 1;
        }

        .passage-ar {
            font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
            direction: rtl;
            text-align: right;
            font-size: 1.4rem;
            line-height: 2.2;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .passage-en {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            font-style: italic;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .page-info {
            font-family: sans-serif;
            font-size: 0.9rem;
            color: #666;
        }

        .share-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-light);
            background-color: var(--tag-bg);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
        }

        .share-btn:hover {
            background-color: var(--accent-light);
            color: #ffffff;
        }

        .hidden {
            display: none !important;
        }

        #print-area {
            display: none;
        }

        #reader-view {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .home-page {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            overflow-y: auto;
        }

        .home-card {
            max-width: 640px;
            width: 100%;
            padding: 20px;
        }

        .home-image {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            margin: 0 auto 20px;
            display: block;
        }

        .home-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 25px;
            color: var(--accent-light);
            font-size: 0.9rem;
        }

        .home-divider::before,
        .home-divider::after {
            content: "";
            height: 1px;
            width: 60px;
            background-color: var(--border-color);
        }

        .home-title {
            font-size: 1.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .home-tagline {
            font-style: italic;
            color: var(--accent-light);
            font-size: 1.05rem;
            margin-bottom: 25px;
        }

        .home-text {
            max-width: 520px;
            margin: 0 auto 35px;
            font-size: 1.02rem;
            line-height: 1.85;
            color: #555;
        }

        .home-start-btn {
            padding: 12px 32px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-family: sans-serif;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .home-start-btn:hover {
            background-color: var(--accent-light);
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }
            .print-chapter-title {
                text-align: center;
                font-size: 2rem;
                color: #1b4332;
                margin-bottom: 10px;
            }
            .print-basmala {
                text-align: center;
                font-family: 'Scheherazade New', 'Noto Naskh Arabic', serif;
                font-size: 2.5rem;
                margin-bottom: 30px;
            }
            .print-passage {
                margin-bottom: 25px;
                page-break-inside: avoid;
            }
            .print-ref {
                font-family: sans-serif;
                font-size: 0.8rem;
                font-weight: bold;
                color: #2d6a4f;
                margin-bottom: 6px;
            }
            .print-ar {
                font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
                direction: rtl;
                text-align: right;
                font-size: 1.3rem;
                line-height: 2;
                margin-bottom: 8px;
            }
            .print-en {
                font-family: Georgia, serif;
                font-size: 0.95rem;
                font-style: italic;
                color: #333;
            }
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0 10px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 998;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 999;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .top-nav {
                padding: 12px 15px;
                flex-wrap: wrap;
            }

            .nav-controls input {
                width: 70px;
            }

            .reader-container {
                padding: 20px 15px 90px;
            }

            .pagination {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: var(--sidebar-bg);
                padding: 12px 15px;
                margin-top: 0;
                border-top: 1px solid var(--border-color);
                z-index: 500;
            }

            .chapter-header h2 {
                font-size: 1.4rem;
            }

            .basmala {
                font-size: 2rem;
            }

            .passage {
                flex-direction: column;
            }

            .passage-ref {
                margin-right: 0;
                margin-bottom: 10px;
                width: fit-content;
            }

            .passage-ar {
                font-size: 1.2rem;
            }
        }

        /* Home Page Search */
        .home-search {
            max-width: 480px;
            margin: 0 auto 30px;
            position: relative;
            text-align: left;
        }

        .home-search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        .home-search-input:focus {
            outline: none;
            border-color: var(--accent-light);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 10px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #ffffff;
            text-align: left;
            z-index: 100;
        }

        .search-result-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background-color: #f0f4f1;
        }

        .search-result-ref {
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-light);
            background-color: var(--tag-bg);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .search-result-chapter {
            font-family: sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .search-result-snippet {
            margin-top: 6px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #555;
        }

        .search-result-snippet mark {
            background-color: #ffe9a8;
            color: inherit;
            padding: 0 2px;
            border-radius: 2px;
        }

        .search-no-results {
            padding: 16px;
            text-align: center;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <h1>Kitab Al-Furqan</h1>
            <p id="tagline-text">Book of Proof</p>
        </div>
        <ul class="chapter-list">
            <li class="chapter-item"><button onclick="loadChapter(1)">1. Al-Masihiyyah</button></li>
            <li class="chapter-item"><button onclick="loadChapter(2)">1. Al-Ilhad</button></li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">

        <!-- Home Page -->
        <div id="home-page" class="home-page hidden">
            <div class="home-card">
                <div class="home-search">
                    <input type="text" id="search-input" class="home-search-input" placeholder="Search a word or chapter..." oninput="performSearch()">
                    <div id="search-results" class="search-results hidden"></div>
                </div>

                <img src="https://kitabalfurqan.github.io/furqan.png" alt="Kitab Al-Furqan" class="home-image">
                <div class="home-divider">✦</div>
                <h1 class="home-title">Kitab Al-Furqan</h1>
                <p class="home-tagline" id="home-tagline-text">Book of Proof</p>
                <p class="home-text" id="home-text"></p>

                <button class="home-start-btn" id="home-start-btn" onclick="startReading()"></button>
            </div>
        </div>

        <!-- Reader View -->
        <div id="reader-view" class="hidden">
        <header class="top-nav">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <strong id="current-title">Chapter 1</strong>
                <button class="share-btn" onclick="sharePage()" aria-label="Share" title="Share">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
                <button class="share-btn" onclick="downloadChapterPDF()" aria-label="Download" title="Download Chapter as PDF">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
            </div>
            <div class="nav-controls">
                <label for="jump-input" id="goto-label">Go to:</label>
                <input type="text" id="jump-input" placeholder="1:2">
                <button id="go-btn" onclick="jumpToReference()">Go</button>
            </div>
        </header>

        <div class="reader-container">
            <div id="content-area">
                <!-- Content will be injected dynamically -->
            </div>

            <div class="pagination">
                <button class="btn-page" id="prev-btn" onclick="prevPage()">Previous</button>
                <span class="page-info" id="page-display">Page 1:1</span>
                <button class="btn-page" id="next-btn" onclick="nextPage()">Next</button>
            </div>
        </div>
        </div>
    </main>

    <div id="print-area"></div>

    <script>
        // Sample Book Data Structure (Chapter -> Pages)
        const bookData = {
            1: {
                title: "AL-MASIHIYYAH",
                pages: {
                    1: {
                        en: "While Genesis 1:24-27 states that God created land animals first and then created male and female humans together on the sixth day, Genesis 2:7-19 reverses this sequence by describing God creating Adam first, then forming the beasts of the field and birds of the air to see what he would name them, and finally creating Eve from Adam's rib.",
                        ar: "في حين تنص سفر التكوين 1:24-27 على أن الله خلق حيوانات البر أولاً، ثم خلق الإنسان ذكراً وأنثى معاً في اليوم السادس، فإن سفر التكوين 2:7-19 يعكس هذا التسلسل، حيث يصف كيف خلق الله آدم أولاً، ثم شكّل حيوانات البر وطيور السماء ليرى ماذا سيسميها، وأخيراً خلق حواء من ضلع آدم.",

                        de: "Während Genesis 1,24-27 besagt, dass Gott zuerst die Landtiere erschuf und dann am sechsten Tag Mann und Frau gemeinsam erschuf, kehrt Genesis 2,7-19 diese Reihenfolge um, indem beschrieben wird, wie Gott zuerst Adam erschuf, dann die Tiere des Feldes und die Vögel des Himmels formte, um zu sehen, wie er sie nennen würde, und schließlich Eva aus Adams Rippe erschuf."
                    },
                    2: {

                    3: {
                        en: "While Matthew 27:3-8 records that Judas Iscariot felt remorse returned the thirty silver coins to the temple priests who used them to buy a field, and then went away and hanged himself, Acts 1:18 describes Judas using his own wicked payment to buy the field himself, where he fell head long and his body burst open with all his intestines spilling out.",
                        ar: "في حين أن إنجيل متى 27:3-8 يذكر أن يهوذا الإسخريوطي شعر بالندم، فأعاد الثلاثين قطعة فضية إلى كهنة الهيكل الذين استخدموها لشراء حقل، ثم ذهب وشنق نفسه، فإن سفر أعمال الرسل 1:18 يصف أن يهوذا استخدم أجره الشرير بنفسه لشراء الحقل، حيث سقط على رأسه فانشق جسده وتناثرت أحشائه كلها.",

                        de: "Während Matthäus 27,3-8 berichtet, dass Judas Iskariot Reue empfand, die dreißig Silberstücke den Tempelpriestern zurückgab, die damit einen Acker kauften, und dann wegging und sich erhängte, beschreibt Apostelgeschichte 1,18, dass Judas mit seinem eigenen bösen Lohn selbst den Acker kaufte, wobei er kopfüber stürzte, sein Leib aufplatzte und alle seine Eingeweide heraustraten."
