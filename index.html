<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://kitabalfurqan.github.io/assets/furqan.ico" sizes="any">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <title>Kitab Al-Furqan</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --sidebar-bg: #ffffff;
            --text-color: #2b2b2b;
            --accent-color: #1b4332;
            --accent-light: #2d6a4f;
            --border-color: #e0e0e0;
            --tag-bg: #e8f5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            padding: 20px;
            background-color: var(--accent-color);
            color: #ffffff;
            text-align: center;
        }

        .brand h1 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .brand p {
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
        }

        .chapter-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .chapter-item {
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-item button {
            width: 100%;
            text-align: left;
            padding: 15px 20px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, color 0.2s;
        }

        .chapter-item button:hover,
        .chapter-item button.active {
            background-color: #f0f4f1;
            color: var(--accent-light);
            font-weight: bold;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-nav {
            background-color: #ffffff;
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-controls input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 90px;
            font-size: 0.9rem;
            text-align: center;
        }

        .nav-controls button, .btn-page {
            padding: 8px 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .nav-controls button:hover, .btn-page:hover {
            background-color: var(--accent-light);
        }

        .reader-container {
            max-width: 750px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
        }

        .chapter-header h2 {
            font-size: 2rem;
            color: var(--accent-color);
        }

        .basmala {
            font-family: 'Scheherazade New', 'Noto Naskh Arabic', 'Traditional Arabic', serif;
            direction: rtl;
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-light);
            margin-top: 12px;
            line-height: 1.4;
        }

        .passage {
            display: flex;
            margin-bottom: 25px;
            line-height: 1.8;
            font-size: 1.15rem;
        }

        .passage-ref {
            font-family: sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-light);
            background-color: var(--tag-bg);
            padding: 4px 8px;
            border-radius: 4px;
            height: fit-content;
            margin-right: 15px;
            user-select: none;
        }

        .passage-text {
            flex-grow: 1;
        }

        .passage-ar {
            font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
            direction: rtl;
            text-align: right;
            font-size: 1.4rem;
            line-height: 2.2;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .passage-en {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            font-style: italic;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .page-info {
            font-family: sans-serif;
            font-size: 0.9rem;
            color: #666;
        }

        .share-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-light);
            background-color: var(--tag-bg);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
        }

        .share-btn:hover {
            background-color: var(--accent-light);
            color: #ffffff;
        }

        .hidden {
            display: none !important;
        }

        #print-area {
            display: none;
        }

        #reader-view {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .home-page {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: safe center;
            text-align: center;
            padding: 60px 20px;
            overflow-y: auto;
        }

        .home-card {
            max-width: 640px;
            width: 100%;
            padding: 20px;
        }

        .home-image {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            margin: 0 auto 20px;
            display: block;
        }

        .home-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 25px;
            color: var(--accent-light);
            font-size: 0.9rem;
        }

        .home-divider::before,
        .home-divider::after {
            content: "";
            height: 1px;
            width: 60px;
            background-color: var(--border-color);
        }

        .home-title {
            font-size: 1.9rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .home-tagline {
            font-style: italic;
            color: var(--accent-light);
            font-size: 1.05rem;
            margin-bottom: 25px;
        }

        .home-text {
            max-width: 520px;
            margin: 0 auto 35px;
            font-size: 1.02rem;
            line-height: 1.85;
            color: #555;
        }

        .home-start-btn {
            padding: 12px 32px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-family: sans-serif;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .home-start-btn:hover {
            background-color: var(--accent-light);
        }

        .home-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 18px;
        }

        .sources-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: var(--tag-bg);
            color: var(--accent-light);
            cursor: pointer;
            flex-shrink: 0;
        }

        .sources-icon-btn:hover {
            background-color: var(--accent-light);
            color: #ffffff;
        }

        @media print {
            @page {
                margin: 20mm 15mm 18mm 15mm;

                @bottom-center {
                    content: counter(page);
                    font-family: Arial, sans-serif;
                    font-size: 8pt;
                    color: #555;
                }
            }

            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }
            .print-chapter-title {
                text-align: center;
                font-size: 2rem;
                color: #1b4332;
                margin-bottom: 10px;
            }
            .print-basmala {
                text-align: center;
                font-family: 'Scheherazade New', 'Noto Naskh Arabic', serif;
                font-size: 2.5rem;
                margin-bottom: 30px;
            }
            .print-passage {
                margin-bottom: 25px;
                page-break-inside: auto;
                break-inside: auto;
            }
            .print-ref {
                font-family: sans-serif;
                font-size: 0.8rem;
                font-weight: bold;
                color: #2d6a4f;
                margin-bottom: 6px;
            }
            .print-ar {
                font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
                direction: rtl;
                text-align: right;
                font-size: 1.3rem;
                line-height: 2;
                margin-bottom: 8px;
            }
            .print-en {
                font-family: Georgia, serif;
                font-size: 0.95rem;
                font-style: italic;
                color: #333;
            }
            .print-title-page {
                page-break-after: always;
                text-align: center;
                padding-top: 150px;
            }
            .print-title-page h1 {
                font-size: 2.6rem;
                color: #1b4332;
                margin-bottom: 15px;
            }
            .print-title-image {
                width: 180px;
                height: auto;
                margin: 0 auto 25px;
                display: block;
            }
            .print-title-page .print-author {
                font-size: 1.2rem;
                color: #333;
                margin-top: 40px;
            }
            .print-toc-page {
                page-break-after: always;
            }
            .print-toc-page h2 {
                text-align: center;
                font-size: 1.6rem;
                color: #1b4332;
                margin-bottom: 20px;
            }
            .print-toc-item {
                font-family: sans-serif;
                font-size: 1rem;
                padding: 6px 0;
                border-bottom: 1px dotted #ccc;
            }
            .print-chapter-title {
                page-break-before: always;
                page-break-after: avoid;
            }

            .print-basmala {
                page-break-after: avoid;
            }

            .print-passage:first-of-type {
                page-break-before: avoid;
            }
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0 10px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 998;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 999;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .top-nav {
                padding: 12px 15px;
                flex-wrap: wrap;
            }

            .nav-controls input {
                width: 70px;
            }

            .reader-container {
                padding: 20px 15px 90px;
            }

            .pagination {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: var(--sidebar-bg);
                padding: 12px 15px;
                margin-top: 0;
                border-top: 1px solid var(--border-color);
                z-index: 500;
            }

            .chapter-header h2 {
                font-size: 1.4rem;
            }

            .basmala {
                font-size: 2rem;
            }

            .passage {
                flex-direction: column;
            }

            .passage-ref {
                margin-right: 0;
                margin-bottom: 10px;
                width: fit-content;
            }

            .passage-ar {
                font-size: 1.2rem;
            }
        }

        .home-search {
            max-width: 480px;
            margin: 0 auto 30px;
            position: relative;
            text-align: left;
        }

        .home-search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        .home-search-input:focus {
            outline: none;
            border-color: var(--accent-light);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 10px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #ffffff;
            text-align: left;
            z-index: 100;
        }

        .search-result-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background-color: #f0f4f1;
        }

        .search-result-ref {
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-light);
            background-color: var(--tag-bg);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .search-result-chapter {
            font-family: sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .search-result-snippet {
            margin-top: 6px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #555;
        }

        .search-result-snippet mark {
            background-color: #ffe9a8;
            color: inherit;
            padding: 0 2px;
            border-radius: 2px;
        }

        .search-no-results {
            padding: 16px;
            text-align: center;
            color: #888;
            font-size: 0.9rem;
        }

        .sources-count {
            font-family: sans-serif;
            font-size: 0.85rem;
            color: #888;
            margin: -15px 0 25px;
        }

.sources-list {
    max-width: 700px;
    margin: 0 auto;
    text-align: left;
}

#sources-back-btn {
    margin-top: 30px;
}

.sources-category {
    margin-bottom: 28px;
}

        .sources-category:last-child {
            margin-bottom: 0;
        }

        .sources-category-label {
            font-family: sans-serif;
            font-size: 0.78rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-light);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .sources-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 640px) {
            .sources-grid {
                grid-template-columns: 1fr;
            }
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .source-item:hover {
            border-color: var(--accent-light);
        }

        .source-favicon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 6px;
            object-fit: contain;
            background-color: var(--tag-bg);
            padding: 4px;
        }

        .source-info {
            flex-grow: 1;
            min-width: 0;
        }

        .source-title {
            font-family: sans-serif;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--accent-color);
            margin-bottom: 3px;
        }

        .source-url {
            font-family: sans-serif;
            font-size: 0.8rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .source-arrow {
            flex-shrink: 0;
            color: #bbb;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        .source-item:hover .source-arrow {
            color: var(--accent-light);
            transform: translate(2px, -2px);
        }

        .sources-empty {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar">
        <div class="brand">
            <h1>Kitab Al-Furqan</h1>
            <p id="tagline-text">Book of Proof</p>
        </div>
        <ul class="chapter-list">
            <li class="chapter-item"><button onclick="loadChapter(1)">1. Al-Masihiyyah</button></li>
            <li class="chapter-item"><button onclick="loadChapter(2)">2. Al-Ilhad</button></li>
            <li class="chapter-item"><button onclick="loadChapter(3)">3. Al-Yahudiyyah</button></li>
            <li class="chapter-item"><button onclick="loadChapter(4)">4. Al-Hindusiyah</button></li>
            <li class="chapter-item"><button onclick="loadChapter(5)">5. Al-Budhiyyah</button></li>
            <li class="chapter-item"><button onclick="loadChapter(6)">6. Al-Islam</button></li>
        </ul>
    </aside>

    <main class="main-content">

        <div id="home-page" class="home-page hidden">
            <div class="home-card">
                <div class="home-search">
                    <input type="text" id="search-input" class="home-search-input" placeholder="Search a word or chapter..." oninput="performSearch()">
                    <div id="search-results" class="search-results hidden"></div>
                </div>

                <img src="https://kitabalfurqan.github.io/assets/furqan.png" alt="Kitab Al-Furqan" class="home-image">
                <div class="home-divider">﷽</div>
                <h1 class="home-title">Kitab Al-Furqan</h1>
                <p class="home-tagline" id="home-tagline-text">Book of Proof</p>
                <p class="home-text" id="home-text"></p>

                <div class="home-actions">
                    <button class="home-start-btn" id="home-start-btn" onclick="startReading()"></button>
                    <button class="sources-icon-btn" onclick="location.hash='source'" aria-label="Sources" title="Sources">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="sources-page" class="home-page hidden">
            <div class="home-card">
                <div class="home-divider">﷽</div>
                <h1 class="home-title" id="sources-title-text">Sources</h1>
                <p class="home-tagline" id="sources-tagline-text">Where the information in this book comes from</p>
                <p class="sources-count" id="sources-count-text"></p>
                <div id="sources-list" class="sources-list"></div>
                <button class="home-start-btn" id="sources-back-btn" onclick="location.hash=''">Back to Home</button>
            </div>
        </div>

        <div id="reader-view" class="hidden">
        <header class="top-nav">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <strong id="current-title">Chapter 1</strong>
                <button class="share-btn" onclick="sharePage()" aria-label="Share" title="Share">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
                <button class="share-btn" onclick="downloadBookPDF()" aria-label="Download" title="Download Book as PDF">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
            </div>
            <div class="nav-controls">
                <label for="jump-input" id="goto-label">Go to:</label>
                <input type="text" id="jump-input" placeholder="1:2">
                <button id="go-btn" onclick="jumpToReference()">Go</button>
            </div>
        </header>

        <div class="reader-container">
            <div id="content-area">
            </div>

            <div class="pagination">
                <button class="btn-page" id="prev-btn" onclick="prevPage()">Previous</button>
                <span class="page-info" id="page-display">Page 1:1</span>
                <button class="btn-page" id="next-btn" onclick="nextPage()">Next</button>
            </div>
        </div>
        </div>
    </main>

    <div id="print-area"></div>

    <script>
        const bookData = {
            1: {
                title: "AL-MASIHIYYAH",
                pages: {
                    1: {
                        en: "While Genesis 1:24-27 states that God created land animals first and then created male and female humans together on the sixth day, Genesis 2:7-19 reverses this sequence by describing God creating Adam first, then forming the beasts of the field and birds of the air to see what he would name them, and finally creating Eve from Adam's rib.",
                        ar: "في حين تنص سفر التكوين 1:24-27 على أن الله خلق حيوانات البر أولاً، ثم خلق الإنسان ذكراً وأنثى معاً في اليوم السادس، فإن سفر التكوين 2:7-19 يعكس هذا التسلسل، حيث يصف كيف خلق الله آدم أولاً، ثم شكّل حيوانات البر وطيور السماء ليرى ماذا سيسميها، وأخيراً خلق حواء من ضلع آدم.",
                        tr: "Tekvin 1:24-27, Tanrı'nın önce kara hayvanlarını yarattığını, ardından altıncı günde erkek ve dişiyi birlikte yarattığını belirtirken, Tekvin 2:7-19 bu sırayı tersine çevirerek Tanrı'nın önce Adem'i yarattığını, ardından onlara ne isim vereceğini görmek için kır hayvanlarını ve gökyüzü kuşlarını şekillendirdiğini ve son olarak Havva'yı Adem'in kaburgasından yarattığını anlatır.",
                        de: "Während Genesis 1,24-27 besagt, dass Gott zuerst die Landtiere erschuf und dann am sechsten Tag Mann und Frau gemeinsam erschuf, kehrt Genesis 2,7-19 diese Reihenfolge um, indem beschrieben wird, wie Gott zuerst Adam erschuf, dann die Tiere des Feldes und die Vögel des Himmels formte, um zu sehen, wie er sie nennen würde, und schließlich Eva aus Adams Rippe erschuf."
                    },
                    2: {
                        en: "While 2 Samuel 24:1 records that the Lord was angry with Israel and Judah, the parallel historical account in 1 Chronicles 21:1 explicity attributes the exactt same census order to Satan standing up against Israel and provoking to count the people.",
                        ar: "في حين أن 2 صموئيل 24:1 يذكر أن الرب كان غاضبًا على إسرائيل ويهوذا، فإن السرد التاريخي الموازي في 1 أخبار الأيام 21:1 ينسب صراحةً الأمر نفسه بالضبط بإجراء التعداد السكاني إلى الشيطان الذي وقف ضد إسرائيل وحرض على إحصاء الشعب.",
                        tr: "2. Samuel 24:1, Rab'bin İsrail ve Yahuda'ya öfkelendiğini kaydederken, paralel tarihsel anlatım olan 1. Tarihler 21:1, aynı nüfus sayımı emrini açıkça Şeytan'ın İsrail'e karşı ayaklanıp halkı saymaya kışkırtmasına atfeder.",
                        de: "Während 2. Samuel 24,1 berichtet, dass der Herr über Israel und Juda zornig war, schreibt der parallele historische Bericht in 1. Chronik 21,1 denselben Volkszählungsbefehl ausdrücklich dem Satan zu, der sich gegen Israel erhob und dazu anstiftete, das Volk zu zählen."
                    },
                    3: {
                        en: "While Matthew 27:3-8 records that Judas Iscariot felt remorse returned the thirty silver coins to the temple priests who used them to buy a field, and then went away and hanged himself, Acts 1:18 describes Judas using his own wicked payment to buy the field himself, where he fell head long and his body burst open with all his intestines spilling out.",
                        ar: "في حين أن إنجيل متى 27:3-8 يذكر أن يهوذا الإسخريوطي شعر بالندم، فأعاد الثلاثين قطعة فضية إلى كهنة الهيكل الذين استخدموها لشراء حقل، ثم ذهب وشنق نفسه، فإن سفر أعمال الرسل 1:18 يصف أن يهوذا استخدم أجره الشرير بنفسه لشراء الحقل، حيث سقط على رأسه فانشق جسده وتناثرت أحشائه كلها.",
                        tr: "Matta 27:3-8, Yahuda İskariyot'un pişmanlık duyarak otuz gümüş parayı, bunları bir tarla satın almak için kullanan tapınak rahiplerine geri verdiğini ve ardından gidip kendini astığını kaydederken, Elçilerin İşleri 1:18, Yahuda'nın kendi kötü ücretiyle tarlayı bizzat satın aldığını, baş aşağı düşerek bedeninin yarıldığını ve tüm bağırsaklarının döküldüğünü anlatır.",
                        de: "Während Matthäus 27,3-8 berichtet, dass Judas Iskariot Reue empfand, die dreißig Silberstücke den Tempelpriestern zurückgab, die damit einen Acker kauften, und dann wegging und sich erhängte, beschreibt Apostelgeschichte 1,18, dass Judas mit seinem eigenen bösen Lohn selbst den Acker kaufte, wobei er kopfüber stürzte, sein Leib aufplatzte und alle seine Eingeweide heraustraten."
                    },
                    4: {
                        en: "While critics often attempt to smear the global Muslim Ummah by pointing to the extremist groups or historical age of marriage norms, the Quran explicity condemns all forms of terrorism and the taking of innocent lives (Surah Al-Ma'idah 5:32), while historical context that young adult unions were standard social and legal practices across all ancient and medieval civilations, including biblical societies, making it entirely dishonest to apply modern legal standards selectively against Muslims while ignoring the overwhelmingly peaceful teachings and vast constributions of over 2 billion believers worldwide.",
                        ar: "في حين يحاول النقاد في كثير من الأحيان تشويه صورة الأمة الإسلامية العالمية من خلال الإشارة إلى الجماعات المتطرفة أو الأعراف التاريخية المتعلقة بسن الزواج، إلا أن القرآن الكريم يدين صراحةً جميع أشكال الإرهاب وسفك أرواح الأبرياء (سورة المائدة 5:32)، في حين أن السياق التاريخي يشير إلى أن زواج الشباب كان ممارسة اجتماعية وقانونية معتادة في جميع الحضارات القديمة والوسطى، بما في ذلك المجتمعات التوراتية، مما يجعل من غير النزيه على الإطلاق تطبيق المعايير القانونية الحديثة بشكل انتقائي ضد المسلمين مع تجاهل التعاليم السلمية الساحقة والمساهمات الهائلة لأكثر من ملياري مؤمن في جميع أنحاء العالم.",
                        tr: "Eleştirmenler sıklıkla aşırılıkçı grupları veya tarihsel evlilik yaşı normlarını işaret ederek küresel Müslüman Ümmet'i karalamaya çalışsa da, Kur'an her türlü terörizmi ve masum canların alınmasını açıkça kınar (Maide Suresi 5:32) ayrıca tarihsel bağlam, genç erişkin evliliklerinin İncil toplumları dahil tüm antik ve ortaçağ medeniyetlerinde standart bir sosyal ve hukuki uygulama olduğunu göstermektedir bu da dünya çapında 2 milyardan fazla inananın büyük ölçüde barışçıl öğretilerini ve muazzam katkılarını görmezden gelirken modern hukuki standartları seçici bir şekilde yalnızca Müslümanlara uygulamayı tamamen dürüstlükten uzak kılmaktadır.",
                        de: "Während Kritiker oft versuchen, die globale muslimische Umma zu verunglimpfen, indem sie auf extremistische Gruppen oder historische Heiratsalternormen verweisen, verurteilt der Koran ausdrücklich jede Form von Terrorismus und die Tötung unschuldiger Menschen (Sure Al-Ma'ida 5:32), während der historische Kontext zeigt, dass frühe Eheschließungen junger Erwachsener in allen antiken und mittelalterlichen Zivilisationen, einschließlich biblischer Gesellschaften, gängige soziale und rechtliche Praxis waren, was es völlig unredlich macht, moderne rechtliche Maßstäbe selektiv gegen Muslime anzuwenden, während die überwiegend friedlichen Lehren und der immense Beitrag von über 2 Milliarden Gläubigen weltweit ignoriert werden."
                    },
                    5: {
                        en: "While critics attempt to single out Muslims for cousin marriages, consanguity was historically widespread throughout European and Christian history, particularly among European royalty, aristocracy, and rural populations. Furthermore, cousin marriage is an ancient cultural tradition practiced by specific regional ethnic groups such as Kurds, rather than a universal or compulsory religious mandate.",
                        ar: "في حين يحاول النقاد توجيه اللوم إلى المسلمين وحدهم فيما يتعلق بزواج الأقارب، فإن زواج الأقارب كان منتشرًا على نطاق واسع عبر التاريخ الأوروبي والمسيحي، لا سيما بين العائلات الملكية والأرستقراطية والسكان الريفيين في أوروبا. علاوة على ذلك، فإن زواج الأقارب هو تقليد ثقافي قديم تمارسه مجموعات عرقية إقليمية محددة مثل الأكراد، وليس فريضة دينية عالمية أو إلزامية.",
                        tr: "Eleştirmenler kuzen evliliği konusunda Müslümanları özellikle hedef almaya çalışsa da, akraba evliliği tarihsel olarak Avrupa ve Hristiyan tarihinde, özellikle Avrupa kraliyet aileleri, aristokrasisi ve kırsal nüfusu arasında yaygındı. Ayrıca kuzen evliliği, evrensel veya zorunlu bir dini emir olmaktan ziyade, Kürtler gibi belirli bölgesel etnik grupların uyguladığı kadim bir kültürel gelenektir.",
                        de: "Während Kritiker versuchen, Muslime wegen Cousinen-Ehen besonders herauszustellen, war Verwandtenehe historisch in der europäischen und christlichen Geschichte weit verbreitet, insbesondere unter europäischem Adel, Aristokratie und ländlicher Bevölkerung. Darüber hinaus ist die Cousinen-Ehe eine uralte kulturelle Tradition, die von bestimmten regionalen ethnischen Gruppen wie den Kurden praktiziert wird, und kein universelles oder verpflichtendes religiöses Gebot."
                    },
                    6: {
                        en: 'While traditional Christian dogma claims that Jesus is God or literal "Son of God", Jesus himself explicity rejected divine equality by affirming that God alone is the absolute supreme deity (Mark 10:18), praying directly to God as his Creator (Luke 22:42) admitting that his knowledge was limited compared to the Father (Mark 13:32), and declaring "the Father is greater than I" (John 14:28), textual evidence that renders divine co-equality logically and scripturally impossible within the Gospel records themselves.',
                        ar: "في حين تدعي العقيدة المسيحية التقليدية أن يسوع هو الله أو «ابن الله» بالمعنى الحرفي، فإن يسوع نفسه رفض صراحةً المساواة الإلهية، حيث أكد أن الله وحده هو الإله المطلق الأعلى (مرقس 10:18)، وصلى مباشرةً إلى الله بصفته خالقه (لوقا 22:42)، واعترف بأن معرفته محدودة مقارنةً بالآب (مرقس 13:32)، وأعلن أن «الآب أعظم مني» (يوحنا 14:28)، وهي أدلة نصية تجعل المساواة الإلهية مستحيلة منطقياً وكتابياً ضمن سجلات الأناجيل نفسها.",
                        tr: "Geleneksel Hristiyan dogması İsa'nın Tanrı ya da gerçek anlamda 'Tanrı'nın Oğlu' olduğunu iddia etse de, İsa'nın kendisi, yalnızca Tanrı'nın mutlak yüce ilah olduğunu doğrulayarak (Markos 10:18), Yaratıcısı olarak doğrudan Tanrı'ya dua ederek (Luka 22:42), bilgisinin Baba'ya kıyasla sınırlı olduğunu kabul ederek (Markos 13:32) ve 'Baba benden üstündür' diyerek (Yuhanna 14:28) tanrısal eşitliği açıkça reddetmiştir bu metinsel kanıtlar, İncil kayıtlarının kendi içinde bile tanrısal eş-eşitliği mantıksal ve kutsal metin açısından imkansız kılmaktadır.",
                        de: "Während die traditionelle christliche Lehre behauptet, Jesus sei Gott oder wörtlich der 'Sohn Gottes', wies Jesus selbst die göttliche Gleichheit ausdrücklich zurück, indem er bekräftigte, dass Gott allein die absolute höchste Gottheit ist (Markus 10,18), direkt zu Gott als seinem Schöpfer betete (Lukas 22,42), zugab, dass sein Wissen im Vergleich zum Vater begrenzt war (Markus 13,32), und erklärte: 'Der Vater ist größer als ich' (Johannes 14,28), textliche Beweise, die eine göttliche Gleichrangigkeit innerhalb der Evangelienberichte selbst logisch und schriftlich unmöglich machen."
                    },
                    7: {
                        en: `While Christian theology elevated Jesus to divinity, the text of the Gospels directly affirms his identity as a prophet when Jesus himself declares that "a prophet is not without honor except in his own town" (Luke 4:24) and the crowds recognize him as "Jesus, the prophet from Nazareth" (Matthew 21:11), which aligns with the Quranic reality where Jesus (peace be upon him), explicitly identifies himself as a servant and prophet of God (Surah Maryam 19:30) and is honored as true Messiah (Al-Masih) sent to perform miracles, preach pure monotheism, and guide the Children of Israel (Surah Ali'Imran 3:45 - 49)`,
                        ar: "في حين أن اللاهوت المسيحي رفع يسوع إلى مرتبة الألوهية، فإن نص الأناجيل يؤكد بشكل مباشر هويته كنبي عندما يصرح يسوع نفسه بأن «ليس نبيٌّ بلا كرامة إلا في وطنه» (لوقا 4:24)، وتعترف الجماهير به على أنه «يسوع، النبي من الناصرة» (متى 21:11)، وهو ما يتوافق مع الحقيقة القرآنية التي يصف فيها عيسى (عليه السلام) نفسه صراحةً بأنه عبد الله ونبيه (سورة مريم 19:30) ويُكرم باعتباره المسيح الحقيقي (المسيح) المرسل ليصنع المعجزات، ويدعو إلى التوحيد الخالص، ويهدي بني إسرائيل (سورة آل عمران 3:45 - 49)",
                        tr: "Hristiyan teolojisi İsa'yı ilahlık mertebesine yükseltse de, İncil metinleri, İsa'nın kendisinin 'bir peygamber kendi memleketi dışında saygı görmez' (Luka 4:24) demesi ve halk kalabalıklarının onu 'Nasıralı peygamber İsa' (Matta 21:11) olarak tanıması ile onun bir peygamber olduğu kimliğini doğrudan doğrulamaktadır bu da İsa'nın (aleyhisselam) kendisini Tanrı'nın kulu ve peygamberi olarak açıkça tanımladığı (Meryem Suresi 19:30) ve mucizeler göstermek, saf tevhidi tebliğ etmek ve İsrailoğullarına rehberlik etmek için gönderilen gerçek Mesih (el-Mesih) olarak onurlandırıldığı Kur'ani gerçeklikle örtüşmektedir (Al-i İmran Suresi 3:45-49).",
                        de: "Während die christliche Theologie Jesus zur Göttlichkeit erhob, bestätigt der Text der Evangelien direkt seine Identität als Prophet, wenn Jesus selbst erklärt, dass 'ein Prophet nirgends weniger gilt als in seiner Heimat' (Lukas 4,24) und die Menschenmenge ihn als 'Jesus, den Propheten aus Nazareth' (Matthäus 21,11) erkennt, was mit der koranischen Realität übereinstimmt, in der Jesus (Friede sei mit ihm) sich selbst ausdrücklich als Diener und Prophet Gottes bezeichnet (Sure Maryam 19,30) und als wahrer Messias (Al-Masih) geehrt wird, der gesandt wurde, um Wunder zu wirken, den reinen Monotheismus zu predigen und die Kinder Israels zu leiten (Sure Al-Imran 3,45-49)."
                    },
                    8: {
                        en: `While non-Muslims often claim the final messenger(ﷺ) was unmentioned outside the Quran, the Bible preserves explicit references to him such as Deuteronomy 18:18 foretelling a prophet "like unto Moses" from among the brethren of the Israelites (the Ishmaelites), Song of Solomon 5:16 naming him in original Hebrew as Mahamaddim, and John 14:16 predicting the Paraclete ("Advocate/Praised One", translatting the name Ahmad). There is also religious connections with non-Abrahamic religions as well, like the Hindu Atharva Veda (Kuntapa Sukta 20.127) and Bhavishya Purana (3.3.3), but this isn't the right Chapter to explain this. This Chapter is only about Christianity.`,
                        ar: `في حين يدعي غير المسلمين غالبًا أن الرسول الأخير (ﷺ) لم يُذكر خارج القرآن، فإن الكتاب المقدس يحتفظ بإشارات صريحة إليه، مثل سفر التثنية 18:18 الذي يتنبأ بنبي «مثل موسى» من بين إخوة بني إسرائيل (الإسماعيليين)، ونشيد الأنشاد 5:16 الذي يسميه باللغة العبرية الأصلية «ماهاماديم»، وإنجيل يوحنا 14:16 الذي يتنبأ بالباراكليت («المدافع/الممدوح»، وهو ترجمة لاسم أحمد). كما توجد صلات دينية مع أديان غير إبراهيمية أيضًا، مثل «أثارفا فيدا» الهندوسية (كونتابا سوكتا 20:127) و«بهافيشيا بورانا» (3:3:3)، لكن هذا ليس الفصل المناسب لشرح ذلك. فهذا الفصل يقتصر على المسيحية فقط.`,
                        tr: "Müslüman olmayanlar genellikle son elçinin (ﷺ) Kur'an dışında hiç anılmadığını iddia etse de, Tevrat, İsrailoğullarının kardeşleri (İsmailoğulları) arasından 'Musa'ya benzer' bir peygamberi haber veren Tesniye 18:18, onu orijinal İbranicede Mahamaddim olarak adlandıran Ezgiler Ezgisi 5:16 ve Ahmed ismine karşılık gelen Paraklit'i ('Yardımcı/Övülmüş Olan') haber veren Yuhanna 14:16 gibi ona açık atıflar taşımaktadır. Hindu Atharva Veda'sı (Kuntapa Sukta 20.127) ve Bhavishya Purana (3.3.3) gibi İbrahimi olmayan dinlerle de dini bağlantılar bulunmaktadır, ancak bunu açıklamak için doğru bölüm burası değildir. Bu bölüm yalnızca Hristiyanlık hakkındadır.",
                        de: "Während Nichtmuslime oft behaupten, der letzte Gesandte (ﷺ) werde außerhalb des Korans nicht erwähnt, bewahrt die Bibel ausdrückliche Hinweise auf ihn, etwa 5. Mose 18,18, das einen Propheten 'wie Mose' aus der Mitte der Brüder der Israeliten (der Ismaeliten) vorhersagt, das Hohelied 5,16, das ihn im ursprünglichen Hebräisch als Mahamaddim benennt, und Johannes 14,16, das den Paraklet ('Fürsprecher/Gepriesener', eine Übersetzung des Namens Ahmad) voraussagt. Es gibt auch religiöse Verbindungen zu nicht-abrahamitischen Religionen, wie dem hinduistischen Atharva Veda (Kuntapa Sukta 20.127) und der Bhavishya Purana (3.3.3), aber dies ist nicht das richtige Kapitel, um dies zu erklären. Dieses Kapitel behandelt ausschließlich das Christentum."
                    },
                    9: {
                        en: "While trinitarian theology asserts that God is one single essence existing simultaneously as three distinct co-equal persons, this concept violates the fundamental logical Law of Identity (A=B), because if Person A (the Father) is fully God, yet the Father is explicitly not the Son, then they cannot share absolute identity with the same single subject without constituting three seperate deities, meaning that any system attributing distinct self-awareness, will, and interpersonal relationships to three seperate entities in escapably functions as trinitatian polytheism (tritheism) regardless of the semantic claim to monotheism.",
                        ar: "في حين تؤكد اللاهوتية الثالوثية أن الله هو جوهر واحد موجود في آن واحد في صورة ثلاثة أقانيم متميزة متساوية في الجوهر، فإن هذا المفهوم ينتهك قانون الهوية المنطقي الأساسي (A=B)، لأنه إذا كان القانيم «أ» (الأب) هو الله بالكامل، ومع ذلك فإن الآب ليس الابن صراحةً، فلا يمكنهما أن يتشاركا الهوية المطلقة مع نفس الموضوع الواحد دون أن يشكلا ثلاثة آلهة منفصلة، مما يعني أن أي نظام ينسب الوعي الذاتي المتميز، والإرادة، والعلاقات الشخصية إلى ثلاثة كيانات منفصلة، لا مفر من أن يعمل كشرك ثلاثي (ثلاثية) بغض النظر عن الادعاء الدلالي بالتوحيد.",
                        tr: "Teslis teolojisi, Tanrı'nın aynı anda birbirinden ayrı ve eşit üç şahıs olarak var olan tek bir öz olduğunu ileri sürse de, bu kavram temel mantıksal Özdeşlik Yasası'nı (A=B) ihlal etmektedir çünkü eğer A Şahsı (Baba) tam anlamıyla Tanrı ise ve Baba açıkça Oğul değilse, o zaman aynı tek özneyle mutlak özdeşliği paylaşamazlar, aksi halde üç ayrı ilah oluştururlar bu da farklı öz-bilinç, irade ve kişilerarası ilişkiler atfedilen üç ayrı varlığa sahip herhangi bir sistemin, tektanrıcılık iddiasından bağımsız olarak kaçınılmaz biçimde teslisçi çoktanrıcılık (üçtanrıcılık) olarak işlediği anlamına gelmektedir.",
                        de: "Während die trinitarische Theologie behauptet, Gott sei ein einziges Wesen, das gleichzeitig als drei unterschiedliche, gleichrangige Personen existiert, verletzt dieses Konzept das grundlegende logische Identitätsgesetz (A=B), denn wenn Person A (der Vater) vollständig Gott ist, der Vater aber ausdrücklich nicht der Sohn ist, können sie keine absolute Identität mit demselben einzigen Subjekt teilen, ohne drei getrennte Gottheiten zu bilden das bedeutet, dass jedes System, das drei getrennten Wesenheiten unterschiedliches Selbstbewusstsein, Willen und zwischenmenschliche Beziehungen zuschreibt, unweigerlich als trinitarischer Polytheismus (Tritheismus) fungiert, unabhängig vom semantischen Anspruch auf Monotheismus."
                    },
                    10: {
                        en: "While modern mainstream Christianity presents itself as pure monotheism, its historical development under Roman imperial state adoption heavily syncretized native Greco-Roman paganism, adopting December 25th to co-opt the Roman festival of Sol Invictus (Dies Natalis Solis Invicti) and Saturnalia, incorporating spring fertility rituals from the Anglo-Saxon pagan dawn goddess Eostre (Easter), reshaping pure Abrahamic monotheism into a philosophical triad mirroring pagan triune deities (such as the Roman Capitoline Triad or Neoplatonic concepts), and converting pagan ancestral veneration into the cult of saints and relics, thereby replacing the simple, uncorrupted monotheism Isa/Jesus (peace be upon him) with an imperial Roman institution trailored to appease a polytheist empire.",
                        ar: "في حين تُقدِّم المسيحية السائدة الحديثة نفسها على أنها توحيد خالص، فإن تطورها التاريخي في ظل تبني الدولة الإمبراطورية الرومانية لها قد أدى إلى اندماج شديد مع الوثنية اليونانية-الرومانية الأصلية، حيث اعتمدت تاريخ 25 ديسمبر لاستيعاب العيد الروماني «سول إنفيكتوس» (Dies Natalis Solis Invicti) و«ساتورناليا»، ودمجت طقوس الخصوبة الربيعية المرتبطة بإلهة الفجر الوثنية الأنجلوساكسونية «إيوستري» (Easter)، مما أدى إلى إعادة تشكيل التوحيد الإبراهيمي الخالص ليصبح ثالوثًا فلسفيًّا يعكس الآلهة الوثنية الثلاثية (مثل الثالوث الكابيتوليني الروماني أو المفاهيم الأفلاطونية الحديثة)، وتحويل تبجيل الأجداد الوثني إلى عبادة القديسين والآثار، وبذلك استُبدل التوحيد البسيط النقي لإسحاق/يسوع (عليه السلام) بمؤسسة رومانية إمبراطورية صُممت خصيصًا لإرضاء إمبراطورية متعددة الآلهة.",
                        tr: "Modern ana akım Hristiyanlık kendisini saf tevhid olarak sunsa da, Roma İmparatorluğu'nun devlet dini olarak benimsemesi altındaki tarihsel gelişimi, yerli Greko-Romen paganizmiyle yoğun bir şekilde senkretize olmuştur Roma'nın Sol Invictus (Dies Natalis Solis Invicti) ve Saturnalia bayramlarını içselleştirmek için 25 Aralık'ı benimsemiş, Anglosakson pagan şafak tanrıçası Eostre'den (Easter/Paskalya) bahar bereket ritüellerini bünyesine katmış, saf İbrahimi tevhidi pagan üçlü tanrılara (Roma Kapitolin Üçlüsü veya Yeni-Eflatuncu kavramlar gibi) benzeyen felsefi bir üçlemeye dönüştürmüş ve pagan atalar tapınmasını azizler ve kutsal emanetler kültüne çevirmiştir böylece İsa'nın (aleyhisselam) basit, bozulmamış tevhidini, çoktanrılı bir imparatorluğu memnun etmek için tasarlanmış imparatorluk Roma kurumuyla değiştirmiştir.",
                        de: "Während sich das moderne Mainstream-Christentum als reinen Monotheismus darstellt, führte seine historische Entwicklung unter der Annahme durch den römischen Staat zu einer starken Synkretisierung mit dem einheimischen griechisch-römischen Heidentum: Es übernahm den 25. Dezember, um das römische Fest Sol Invictus (Dies Natalis Solis Invicti) und die Saturnalien zu vereinnahmen, integrierte Frühlings-Fruchtbarkeitsriten der angelsächsischen heidnischen Morgenröte-Göttin Eostre (Ostern), formte den reinen abrahamitischen Monotheismus zu einer philosophischen Trias um, die heidnischen Dreifachgottheiten ähnelt (wie der römischen Kapitolinischen Trias oder neuplatonischen Konzepten), und verwandelte heidnische Ahnenverehrung in den Kult der Heiligen und Reliquien, wodurch der einfache, unverfälschte Monotheismus von Isa/Jesus (Friede sei mit ihm) durch eine imperiale römische Institution ersetzt wurde, die darauf zugeschnitten war, ein polytheistisches Reich zu besänftigen."
                    },
                    11: {
                        en: 'While modern readers often view "Muslim" strictly as a historical label born in 7th-century Arabia, the word linguistically means "one who submits their will completely to God" (Aslama), a definition Jesus (peace be upon him), explicitly fulfilled when he proclaimed, "I seek not my own will but the will of Him who sent me" (John 5:30) and prayed prostrate on his face to the Almighty (Matthew 26:39). Furthermore, in Aramaic, the native Semitic language spoken by Jesus, the name for God is Alaha or Elah (cognate to the Hebrew Elohim and Arabic Allah), proving that Jesus was a monotheistic submitter who prayed to Alaha (Allah) in total surrender, making him a Muslim in faith, practice and terminology.',
                        ar: "في حين أن القراء المعاصرين غالبًا ما ينظرون إلى مصطلح «مسلم» باعتباره مجرد تسمية تاريخية نشأت في شبه الجزيرة العربية في القرن السابع، فإن الكلمة تعني لغويًّا «من يخضع إرادته تمامًا لله» (أسلَمَ)، وهو تعريف حققه يسوع (عليه السلام) صراحةً عندما أعلن: «أنا لا أطلب مشيئتي، بل مشيئة الذي أرسلني» (يوحنا 5:30) وصلى ساجدًا على وجهه للقدير (متى 26:39). علاوةً على ذلك، في اللغة الآرامية، وهي اللغة السامية الأصلية التي كان يتكلمها يسوع، يُطلق على الله اسم «ألاها» أو «إيلا» (وهو مشتق من الكلمة العبرية «إلوهيم» والعربية «الله»)، مما يثبت أن يسوع كان مؤمنًا بالتوحيد وخاضعًا لله، وكان يصلي إلى «ألاها» (الله) في خضوع تام، مما يجعله مسلمًا في العقيدة والممارسة والمصطلحات.",
                        tr: "Modern okuyucular “Müslüman” kelimesini genellikle 7. yüzyıl Arabistan’ında ortaya çıkan tarihsel bir tanım olarak görse de, bu kelime dilbilimsel olarak “iradesini tamamen Tanrı’ya teslim eden kişi” (Aslama) anlamına gelir İsa (barış onun üzerine olsun), şu sözleriyle bu tanımı açıkça yerine getirmiştir: “Ben kendi irademi değil, beni gönderenin iradesini ararım” (Yuhanna 5:30) diyerek ve Yüce Tanrı'ya yüzüstü secde ederek dua ettiğinde açıkça yerine getirmiştir (Matta 26:39). Dahası, İsa’nın konuştuğu Semitik dil olan Aramice’de Tanrı’nın adı Alaha veya Elah’tır (İbranice Elohim ve Arapça Allah kelimeleriyle aynı kökten gelir) bu da İsa’nın, Alaha’ya (Allah’a) tam bir teslimiyetle dua eden tek tanrıcı bir mümin olduğunu kanıtlar ve onu inanç, uygulama ve terminoloji açısından bir Müslüman yapar.",
                        de: "Während moderne Leser den Begriff „Muslim“ oft streng als eine historische Bezeichnung betrachten, die im Arabien des 7. Jahrhunderts entstand, bedeutet das Wort sprachlich „derjenige, der seinen Willen vollständig Gott unterwirft“ (Aslama) - eine Definition, die Jesus (Friede sei mit ihm) ausdrücklich erfüllte, als er verkündete: „Ich suche nicht meinen eigenen Willen, sondern den Willen dessen, der mich gesandt hat“ (Johannes 5,30) und sich mit dem Gesicht zur Erde niederwarf, um zum Allmächtigen zu beten (Matthäus 26,39). Darüber hinaus lautet der Name für Gott im Aramäischen, der semitischen Muttersprache Jesu, „Alaha“ oder „Elah“ (verwandt mit dem hebräischen „Elohim“ und dem arabischen „Allah“), was beweist, dass Jesus ein monotheistischer Gläubiger war, der sich in völliger Hingabe an Alaha (Allah) betete, was ihn in Glauben, Praxis und Terminologie zu einem Muslim machte.",
                    },
                    12: {
                        en: "While Western Christian critics routinely attack Islam over the historical institution of slavery, they ignore that the Bible directly regulates lifelong bandage and physical beating (Exodus 21:20-21, Leviticus 25:44-46), whereas Islam strictly limited captivity to legitimate prisoners of war, forbade racial chattel slavery, granted captives legal humanity and rights to self-purchase (Mukataba), commanded that captives be fed and clothed identically to their guardians, and explicity established emancipation as one of the highhest acts of worship, a stark constrast to the brutal, multi-generationel, race-based plantation slavery practiced across Western Christian empires dehumanized millions while weaponizing scripture to enforce permanent subjection.",
                        ar: "في حين يهاجم النقاد المسيحيون الغربيون الإسلام بشكل روتيني بسبب مؤسسة الرق التاريخية، فإنهم يتجاهلون أن الكتاب المقدس ينص صراحةً على الاستعباد مدى الحياة والضرب الجسدي (سفر الخروج 21:20-21، سفر اللاويين 25:44-46)، في حين أن الإسلام حصر الأسر بشكل صارم في أسرى الحرب الشرعيين، وحظر الرق العنصري، ومنح الأسرى صفة الإنسانية القانونية وحق شراء حريتهم (المكتبة)، وأمر بأن يُطعم الأسرى ويُلبسوا تمامًا مثل أولياء أمورهم، وأقر صراحةً أن تحرير الأسرى هو من أعظم أعمال العبادة، في تناقض صارخ مع العبودية الوحشية القائمة على العرق والتي امتدت لعدة أجيال في المزارع، والتي مارستها الإمبراطوريات المسيحية الغربية، حيث جردت الملايين من إنسانيتهم بينما استغلت النصوص الدينية كسلاح لفرض الخضوع الدائم.",
                        tr: "Batılı Hıristiyan eleştirmenler, tarihsel kölelik kurumu nedeniyle İslam’ı rutin olarak eleştirirken, İncil’in ömür boyu esaret ve fiziksel dayak uygulamalarını doğrudan düzenlediğini (Çıkış 21:20-21, Levililer 25:44-46) göz ardı ederler oysa İslam, esaret kurumunu meşru savaş esirleriyle sıkı bir şekilde sınırlandırmış, ırksal köleciliği yasaklamış, esirlere yasal insanlık statüsü ve kendilerini satın alma hakkı (Mukataba), esirlerin koruyucularıyla aynı şekilde beslenip giydirilmesini emretmiş ve köleliğin kaldırılmasını en yüce ibadet eylemlerinden biri olarak açıkça belirlemiştir. Bu, Batı Hıristiyan imparatorluklarında uygulanan, milyonları insanlıktan çıkaran, acımasız, nesiller boyu süren ve ırk temelli plantasyon köleliğiyle keskin bir tezat oluşturmaktadır bu kölelik, kalıcı boyun eğmeyi dayatmak için kutsal metinleri bir silah olarak kullanmıştır.",
                        de: "Während westliche christliche Kritiker den Islam regelmäßig wegen der historischen Institution der Sklaverei angreifen, ignorieren sie, dass die Bibel lebenslange Knechtschaft und körperliche Züchtigung ausdrücklich vorschreibt (2. Mose 21,20-21 3. Mose 25,44-46), während der Islam die Gefangenschaft streng auf rechtmäßige Kriegsgefangene beschränkte, die rassistisch motivierte Leibeigenschaft verbot, Gefangenen rechtliche Menschlichkeit und das Recht auf Selbstfreikauf gewährte (Mukataba), gebot, dass Gefangene genauso ernährt und gekleidet werden sollten wie ihre Aufseher, und legte die Freilassung ausdrücklich als eine der höchsten Formen der Gottesverehrung fest, ein krasser Gegensatz zur brutalen, generationenübergreifenden, rassistisch motivierten Plantagensklaverei, die in den westlichen christlichen Reichen praktiziert wurde und Millionen Menschen entmenschlichte, während die Heilige Schrift als Mittel zur Durchsetzung dauerhafter Unterwerfung missbraucht wurde."
                    },
                    13: {
                        en: 'While Christian orthodoxy relies on the New Testament as the infallible Word of God, textual criticism proves that its textual transmission was severly altered over 300,000 manuscript variants, major fabricatted inerpolations found in no early manuscripts such as the adulteress story (John 7:53-8:11) and the long resurrection ending of Mark (Mark 16:9-20), the undeniable reality that all 4 Gospels were written decades later by anonymous authors rather than eyewitnesses, and historical evidence showing that core doctrines like the Trinity and the "divine nature" of Jesus were finalized centuries later through voting Roman Church councils like Nicaea (325 CE), textual and historical facts that conclusively destroy of an "uncorrupted" divine scripture.',
                        ar: "في حين تعتمد العقيدة المسيحية الأرثوذكسية على العهد الجديد باعتباره كلمة الله المعصومة من الخطأ، فإن النقد النصي يثبت أن نقله النصي قد تعرض لتغييرات جذرية عبر أكثر من 300,000 اختلاف في المخطوطات، بالإضافة إلى إدخالات ملفقة كبيرة لا توجد في أي مخطوطات قديمة، مثل قصة الزانية (يوحنا 7:53-8:11) والنهاية المطولة للقيامة في إنجيل مرقس (مرقس 16:9-20)، والحقيقة التي لا يمكن إنكارها بأن الأناجيل الأربعة كُتبت جميعها بعد عقود من الزمن على يد مؤلفين مجهولين وليسوا شهود عيان، والأدلة التاريخية التي تُظهر أن العقائد الأساسية مثل الثالوث و«الطبيعة الإلهية» ليسوع تم إقرارها نهائيًا بعد قرون من خلال التصويت في المجامع الكنسية الرومانية مثل مجمع نيقية (325 م)، وهي حقائق نصية وتاريخية تدحض بشكل قاطع فكرة وجود كتاب مقدس «غير محرف».",
                        tr: "Hristiyan ortodoksluğu, Yeni Ahit’i Tanrı’nın yanılmaz Sözü olarak kabul etse de, metin eleştirisi, metnin aktarım sürecinde ciddi değişikliklere uğradığını, 300.000’den fazla el yazması varyantının bulunduğunu, zina eden kadının hikâyesi (Yuhanna 7:53-8:11) ve Markos’un uzun diriliş sonu (Markos 16:9-20) gibi hiçbir erken el yazmasında yer almayan önemli uydurma eklemelerin varlığını kanıtlamaktadır Dört İncil’in de gözle tanıklar tarafından değil, on yıllar sonra isimsiz yazarlar tarafından yazıldığı yadsınamaz gerçeği ve Üçlü Birlik ile İsa’nın “ilahi doğası” gibi temel doktrinlerin, yüzyıllar sonra İznik (MS 325) gibi Roma Kilisesi konseylerindeki oylamalarla kesinleştiğini gösteren tarihsel kanıtlar, “bozulmamış” bir ilahi kutsal metin fikrini kesin olarak çürüten metinsel ve tarihsel gerçeklerdir.",
                        de: "Während sich die christliche Orthodoxie auf das Neue Testament als das unfehlbare Wort Gottes stützt, belegt die Textkritik, dass dessen Überlieferung stark verändert wurde, mit über 300.000 Handschriftenvarianten und bedeutenden, erfundenen Einfügungen, die in keinem frühen Manuskript zu finden sind, wie beispielsweise die Geschichte von der Ehebrecherin (Johannes 7,53-8,11) und das lange Auferstehungsende des Markus (Markus 16,9-20), die unbestreitbare Tatsache, dass alle vier Evangelien erst Jahrzehnte später von anonymen Autoren und nicht von Augenzeugen verfasst wurden, sowie historische Belege, die zeigen, dass Kernlehren wie die Dreifaltigkeit und die „göttliche Natur“ Jesu erst Jahrhunderte später durch Abstimmungen auf römischen Kirchenkonzilen wie dem Konzil von Nicäa (325 n. Chr.) festgelegt wurden, all dies sind textliche und historische Fakten, die die Vorstellung einer „unverfälschten“ göttlichen Schrift endgültig widerlegen."
                    },
                    14: {
                        en: '​While defenders of biblical inerrancy claim that Jesus spoke with absolute divine accuracy on all matters of creation, Gospel texts present him making a clear scientific error in the Parable of the Mustard Seed when he declares that the mustard seed is "the smallest of all seeds on the earth" (Mark 4:31, Matthew 13:32), a statement botanically disproven by modern science, which documents that orchid seeds (Orchidaceae) are vastly smaller and microscopic in comparison, proving that the text reflects localized, limited 1st-century human knowledge rather than the omniscient understanding of an all-knowing divine Creator.',
                        ar: "​في حين يدعي المدافعون عن عدم خطأ الكتاب المقدس أن يسوع تحدث بدقة إلهية مطلقة بشأن جميع أمور الخلق، فإن نصوص الأناجيل تُظهره وهو يرتكب خطأً علمياً واضحاً في «مثل حبة الخردل» عندما يصرح بأن حبة الخردل هي «أصغر البذور على وجه الأرض» (مرقس 4:31، متى 13:32)، وهو قول دحضته العلوم الحديثة من الناحية النباتية، حيث أثبتت أن بذور الأوركيد (Orchidaceae) أصغر بكثير ومجهرية بالمقارنة، مما يثبت أن النص يعكس معرفة بشرية محدودة ومحلية تعود إلى القرن الأول، وليس الفهم الكلي لخالق إلهي عليم بكل شيء.",
                        tr: "​Kutsal Kitabın hatasızlığını savunanlar, İsa’nın yaratılışla ilgili tüm konularda mutlak ilahi doğrulukla konuştuğunu iddia etseler de, İncil metinleri, İsa’nın “Hardal Tohumu Paraboli”nde, hardal tohumunun “yeryüzündeki tüm tohumların en küçüğü” olduğunu (Markos 4:31, Matta 13:32). Bu ifade, modern bilim tarafından botanik açıdan çürütülmüştür çünkü modern bilim, orkide tohumlarının (Orchidaceae) buna kıyasla çok daha küçük ve mikroskobik olduğunu belgelemektedir. Bu da metnin, her şeyi bilen ilahi Yaratıcı’nın sınırsız bilgisi yerine, 1. yüzyıldaki yerel ve sınırlı insan bilgisini yansıttığını kanıtlamaktadır.",
                        de: "Während Verfechter der biblischen Unfehlbarkeit behaupten, Jesus habe in allen Fragen der Schöpfung mit absoluter göttlicher Genauigkeit gesprochen, zeigen die Evangelientexte, dass er im Gleichnis vom Senfkorn einen eindeutigen wissenschaftlichen Fehler begeht, als er erklärt, das Senfkorn sei „das kleinste aller Samenkörner auf der Erde“ (Markus 4,31 Matthäus 13,32), eine Aussage, die von der modernen Wissenschaft botanisch widerlegt wurde. Diese belegt, dass Orchideensamen (Orchidaceae) im Vergleich dazu weitaus kleiner und mikroskopisch sind, was beweist, dass der Text eher das lokale, begrenzte menschliche Wissen des 1. Jahrhunderts widerspiegelt als das allwissende Verständnis eines allwissenden göttlichen Schöpfers."
                    },
                    15: {
                        en: "While Western critics often mischaracterize Islamic tradition regarding women, biblical scripture explicitly mandates female subjugation, commanding that women remain completely silent in churches, submit in all things, and be stripped of authority over men (1 Corinthians 14:34-35, 1 Timothy 2:11-12), even deeming a woman humiliated if her head is uncovered during prayer (1 Corinthians 11:5-6), whereas the Quran established groundbreaking, permanent legal protections over 1,400 years ago by declaring men and women spiritual equals before God (Surah Al-Ahzab 33:35), granting women absolute independent rights to own and manage property, retain their own surnames, reject forced marriages, and receive mandatory financial support while guaranteeing that their earned money remains exclusively theirs, rights that Western and Christian societies denied to women until recent centuries.",
                        ar: "في حين أن النقاد الغربيين غالبًا ما يسيئون تفسير التقاليد الإسلامية المتعلقة بالمرأة، فإن النصوص التوراتية تنص صراحةً على إخضاع المرأة، وتأمر بأن تظل المرأة صامتة تمامًا في الكنائس، وأن تخضع في كل شيء، وأن تُحرم من أي سلطة على الرجال (1 كورنثوس 14:34-35، 1 تيموثاوس 2:11-12)، بل وتعتبر المرأة مُهانة إذا كانت رأسها مكشوفة أثناء الصلاة (1 كورنثوس 11:5-6)، في حين أن القرآن الكريم أرسى حماية قانونية رائدة ودائمة منذ أكثر من 1400 عام بإعلانه المساواة الروحية بين الرجال والنساء أمام الله (سورة الأحزاب 33:35)، ومنح النساء حقوقًا مستقلة مطلقة في امتلاك الممتلكات وإدارتها، والاحتفاظ بأسمائهن العائلية، ورفض الزواج القسري، والحصول على الدعم المالي الإلزامي مع ضمان بقاء الأموال التي يكسبنها ملكًا لهن حصريًّا، وهي حقوق حُرمت منها النساء في المجتمعات الغربية والمسيحية حتى القرون الأخيرة.",
                        tr: "Batı’daki eleştirmenler, kadınlara ilişkin İslam geleneğini sıklıkla yanlış yorumlarken, İncil metinleri kadınların boyun eğmesini açıkça emreder kadınların kiliselerde tamamen sessiz kalmalarını, her konuda itaat etmelerini ve erkekler üzerindeki yetkilerinden mahrum bırakılmalarını buyurur (1 Korintliler 14:34-35, 1. Timoteos 2:11-12), hatta dua sırasında başı açık olan bir kadını aşağılanmış saymaktadır (1. Korintliler 11:5-6). Oysa Kuran, 1.400 yıl önce erkeklerle kadınların Tanrı’nın huzurunda manevi açıdan eşit olduğunu ilan ederek (Ahzab Suresi 33:35), kadınlara mülk sahibi olma ve yönetme, kendi soyadlarını koruma, zorla evlilikleri reddetme ve zorunlu maddi destek alma konusunda mutlak bağımsızlık hakları vermiş ve kazandıkları paranın münhasıran kendilerine ait kalmasını garanti etmiştir bu haklar, Batı ve Hıristiyan toplumları tarafından son birkaç yüzyıla kadar kadınlardan esirgenen haklardır.",
                        de: "Während westliche Kritiker die islamische Tradition in Bezug auf Frauen oft falsch darstellen, schreibt die Bibel ausdrücklich die Unterordnung der Frau vor und gebietet, dass Frauen in den Gemeinden völlig schweigen, sich in allen Dingen unterordnen und jeglicher Autorität über Männer beraubt werden (1. Korinther 14,34-35, 1. Timotheus 2,11-12), und es sogar als Demütigung für eine Frau ansieht, wenn ihr Kopf während des Gebets unbedeckt ist (1. Korinther 11,5-6), während der Koran vor über 1.400 Jahren bahnbrechende, dauerhafte rechtliche Schutzmaßnahmen schuf, indem er Männer und Frauen vor Gott als geistlich gleichwertig erklärte (Sure Al-Ahzab 33,35) und und den Frauen absolute, eigenständige Rechte einräumte, Eigentum zu besitzen und zu verwalten, ihren eigenen Nachnamen beizubehalten, Zwangsehen abzulehnen und einen verbindlichen finanziellen Unterhalt zu erhalten, während gleichzeitig garantiert wurde, dass ihr verdientes Geld ausschließlich ihnen gehört Rechte, die westliche und christliche Gesellschaften den Frauen bis in die letzten Jahrhunderte verwehrten."
                    },
                    16: {
                        en: "While Christian apologists claim the Gospel resurrection and trial narratives are flawless eyewitness historical records, the text reveals irreconcilable chronological and factual breakdowns, such as Mark 15:25 declaring that Jesus was crucified at the third hour (9:00 AM) whereas John 19:14-16 states he was still on trial before Pontius Pilate at the sixth hour (noon), combined with the completely contradictory resurrection details where the four Gospels cannot agree on who went to the tomb, how many angels or men were present inside, or whether Jesus appeared first in Galilee or Jerusalem, demonstrating that the core narratives of Christian theology fail basic standards of historical consistency and textual inerrancy.",
                        ar: "في حين يدعي المدافعون عن المسيحية أن روايات الإنجيل عن القيامة والمحاكمة هي سجلات تاريخية خالية من الأخطاء استندت إلى شهود عيان، فإن النص يكشف عن تناقضات زمنية ووقائعية لا يمكن التوفيق بينها، مثل ما ورد في مرقس 15:25 الذي يذكر أن يسوع صُلب في الساعة الثالثة (9:00 صباحًا)، في حين أن يوحنا 19: 14-16 أنه كان لا يزال يخضع للمحاكمة أمام بيلاطس البنطي في الساعة السادسة (منتصف النهار)، بالإضافة إلى التفاصيل المتناقضة تمامًا بشأن القيامة، حيث لا تتفق الأناجيل الأربعة على من ذهب إلى القبر، أو عدد الملائكة أو الرجال الذين كانوا موجودين بداخله، أو ما إذا كان يسوع قد ظهر أولًا في الجليل أم في أورشليم، مما يدل على أن الروايات الأساسية في اللاهوت المسيحي لا تفي بالمعايير الأساسية للاتساق التاريخي وخلو النص من الأخطاء.",
                        tr: "Hristiyan savunucuları, İncil’deki diriliş ve yargılama anlatılarının kusursuz görgü tanığı tarihsel kayıtları olduğunu iddia etseler de, metin uzlaşmaz kronolojik ve olgusal çelişkiler ortaya koymaktadır örneğin, Markos 15:25’te İsa’nın üçüncü saatte (sabah 9:00) çarmıha gerildiği belirtilirken, Yuhanna 19: 14-16’da ise İsa’nın altıncı saatte (öğlen) hâlâ Pontius Pilatus’un huzurunda yargılandığını belirtmesi gibi uzlaşmaz kronolojik ve olgusal çelişkiler ortaya çıkmaktadır. Buna ek olarak, dört İncil’in mezara kimin gittiği, içeride kaç melek veya insanın bulunduğu ya da İsa’nın ilk olarak Celile’de mi yoksa Kudüs’te mi göründüğü konusunda anlaşamadığı, tamamen çelişkili diriliş ayrıntıları da Hristiyan teolojisinin temel anlatılarının tarihsel tutarlılık ve metinsel hatasızlık gibi temel standartları karşılayamadığını göstermektedir.",
                        de: "Während christliche Apologeten behaupten, die Auferstehungs- und Prozessberichte der Evangelien seien fehlerfreie historische Augenzeugenberichte, offenbart der Text unüberbrückbare chronologische und sachliche Unstimmigkeiten, wie beispielsweise Markus 15,25, wo es heißt, Jesus sei zur dritten Stunde (9:00 Uhr) gekreuzigt worden, während Johannes 19, 14-16 besagt, dass er zur sechsten Stunde (mittags) noch vor Pontius Pilatus stand hinzu kommen die völlig widersprüchlichen Angaben zur Auferstehung, bei denen sich die vier Evangelien nicht darüber einig sind, wer zum Grab ging, wie viele Engel oder Menschen dort anwesend waren oder ob Jesus zuerst in Galiläa oder in Jerusalem erschien, was zeigt, dass die Kernberichte der christlichen Theologie grundlegende Standards der historischen Konsistenz und der textlichen Unfehlbarkeit nicht erfüllen."
                    },
                    17: {
                        en: 'While orthodox Christian theology relies entirely on the death of Jesus (Isa, peace be upon him) on the cross for salvation, divine revelation in the Quran categorically refutes this narrative in Surah An-Nisa 4:157 by explicitly declaring, "They did not kill him, nor did they crucify him, but it was made to appear so to them" (shubbiha lahum), a divine intervention wherein God cast the exact physical likeness of Jesus onto another man who was captured and executed in his place, while Jesus himself was raised up alive into the heavens. This historical truth is further supported by early non-canonical historical records, such as early Gnostic Christian texts (including the Gospel of Basilides and the Second Treatise of the Great Seth), which likewise recorded that a visual substitute was crucified instead of Jesus, proving that human observers were left with nothing more than conjecture and that the true Prophet was divinely saved from an accursed death.',
                        ar: "في حين تعتمد اللاهوت المسيحي الأرثوذكسي كليًّا على موت يسوع (عيسى، عليه السلام) على الصليب لتحقيق الخلاص، فإن الوحي الإلهي في القرآن الكريم يدحض هذه الرواية بشكل قاطع في سورة النساء 4:157، حيث يعلن صراحةً: «ما ماتوا ولم يُصلبوا، بل شُبه لهم» (شُبه لهم)، وهو تدخل إلهي قام فيه الله بإلقاء الشبه الجسدي الدقيق لعيسى على رجل آخر تم أسره وإعدامه بدلاً منه، بينما رُفع عيسى نفسه حياً إلى السماوات. وتدعم هذه الحقيقة التاريخية أيضًا السجلات التاريخية المبكرة غير القانونية، مثل النصوص المسيحية الغنوصية المبكرة (بما في ذلك إنجيل باسيليدس والرسالة الثانية لسيث العظيم)، التي سجلت هي الأخرى أن بديلاً مرئيًا صُلب بدلاً من يسوع، مما يثبت أن الشهود البشريين لم يتبق لهم سوى التخمين، وأن النبي الحقيقي قد أنقذه الله من موت ملعون.",
                        tr: "Ortodoks Hıristiyan teolojisi, kurtuluş için tamamen İsa’nın (İsa, selam onun üzerine olsun) çarmıhta ölümüne dayanırken, Kuran’daki ilahi vahiy, Nisa Suresi 4:157’de şu açık ifadeyle bu anlatıyı kategorik olarak çürütür: “Onlar onu öldürmediler, çarmıha da germediler ancak onlara öyle gösterildi” (shubbiha lahum). Bu, Tanrı’nın İsa’nın tam fiziksel benzerliğini, onun yerine yakalanıp idam edilen başka bir adama yansıtması ve İsa’nın kendisinin ise diri olarak göklere yükseltilmesi şeklinde gerçekleşen ilahi bir müdahaledir. Bu tarihsel gerçek, erken dönem Gnostik Hıristiyan metinleri (Basilides İncili ve Büyük Set’in İkinci Risalesi dahil) gibi kanonik olmayan erken dönem tarihsel kayıtlar tarafından da desteklenmektedir. Bu metinler de İsa’nın yerine görsel bir ikamenin çarmıha gerildiğini kaydetmekte ve insan gözlemcilerin elinde sadece varsayımlardan başka bir şey kalmadığını, gerçek Peygamber’in ise ilahi bir müdahaleyle lanetli bir ölümden kurtarıldığını kanıtlamaktadır.",
                        de: "Während sich die orthodoxe christliche Theologie für die Erlösung ausschließlich auf den Tod Jesu (Isa, Friede sei mit ihm) am Kreuz stützt, widerlegt die göttliche Offenbarung im Koran diese Darstellung in Sure An-Nisa 4:157 kategorisch, indem sie ausdrücklich erklärt: „Sie haben ihn weder getötet noch gekreuzigt, sondern es wurde ihnen so vorgetäuscht“ (shubbiha lahum), ein göttliches Eingreifen, bei dem Gott das exakte physische Abbild Jesu auf einen anderen Mann übertrug, der an seiner Stelle gefangen genommen und hingerichtet wurde, während Jesus selbst lebendig in den Himmel erhoben wurde. Diese historische Wahrheit wird zudem durch frühe nicht-kanonische historische Aufzeichnungen gestützt, wie beispielsweise frühe gnostisch-christliche Texte (darunter das Evangelium des Basilides und die Zweite Abhandlung des Großen Seth), die ebenfalls berichten, dass anstelle von Jesus ein optischer Stellvertreter gekreuzigt wurde, was beweist, dass den menschlichen Beobachtern nichts weiter als Vermutungen blieben und dass der wahre Prophet auf göttliche Weise vor einem verfluchten Tod bewahrt wurde."

                    },
                    18: {
                        en: "While 2 Kings 8:26 records that Ahaziah was twenty-two years old when he began his reign over Jerusalem, the parallel historical record in 2 Chronicles 22:2 states that Ahaziah was forty-two years old when he ascended the throne, an insurmountable chronological impossibility, given that 2 Chronicles 21:20 documents his father Jehoram dying at the age of forty, which would impossibly render the son two years older than his biological father.",
                        ar: "في حين أن سفر الملوك الثاني 8:26 يذكر أن أحزيا كان في الثانية والعشرين من عمره عندما تولى الحكم في أورشليم، إلا أن السجل التاريخي الموازي في سفر أخبار الأيام الثاني 22:2 يذكر أن أحزيا كان في الثانية والأربعين من عمره عندما اعتلى العرش، وهو تناقض زمني لا يمكن تجاوزه، بالنظر إلى أن سفر أخبار الأيام الثاني 21:20 يوثق وفاة والده يهورام وهو في الأربعين من عمره، مما يجعل من المستحيل أن يكون الابن أكبر من والده البيولوجي بسنتين.",
                        tr: "2. Krallar 8:26’da Ahazya’nın Kudüs’te hükümdarlığa başladığında yirmi iki yaşında olduğu belirtilirken, 2. Tarihler 22:2'deki paralel tarihsel kayıtta ise Ahazya'nın tahta çıktığında kırk iki yaşında olduğu belirtilmektedir bu, 2. Tarihler 21:20'de babası Yehoram'ın kırk yaşında öldüğü kaydedildiğinden, aşılmaz bir kronolojik imkansızlıktır zira bu durumda oğul, biyolojik babasından iki yaş büyük olur ki bu imkansızdır.",
                        de: "Während in 2. Könige 8,26 berichtet wird, dass Ahasja zweiundzwanzig Jahre alt war, als er seine Herrschaft über Jerusalem antrat, heißt es in der parallelen historischen Überlieferung in 2. Chronik 22,2, dass Ahasja zweiundvierzig Jahre alt war, als er den Thron bestieg, ein unüberwindbarer chronologischer Widerspruch, da 2. Chronik 21,20 belegt, dass sein Vater Joram im Alter von vierzig Jahren starb, was den Sohn unmöglich zwei Jahre älter machen würde als seinen leiblichen Vater."
                    },
                    19: {
                        en: `While biblical descriptions present a primitive, flat-earth cosmology framed by fixed pillars (1 Samuel 2:8), an immovable surface (1 Chronicles 16:30), "four corners" (Revelation 7:1), and a solid sky canopy (Job 37:18), textual models reflecting 1st-century human assumptions rather than divine omniscience, the Quran demonstrates divine scientific accuracy by describing the earth with the specific Arabic verb Daḥāhā (Surah An-Nazi'at 79:30), a root term referencing both an expanded spatial field and the prolate/oblate shape of an ostrich egg, precisely aligning with modern astrophysics and satellite measurements confirming that gravitational forces deform the earth into an oblate spheroid.`,
                        ar: "في حين أن الأوصاف التوراتية تُقدِّم صورة كونية بدائية تُصوِّر الأرض على أنها مسطحة، محاطة بأعمدة ثابتة (1 صموئيل 2:8)، وسطحًا لا يتحرك (1 أخبار الأيام 16:30)، و«أربع زوايا» (رؤيا 7:1)، وقبة سماوية صلبة (أيوب 37:18)، وهي نماذج نصية تعكس افتراضات البشر في القرن الأول الميلادي بدلاً من العلم الإلهي المطلق، فإن القرآن الكريم يبرهن على الدقة العلمية الإلهية من خلال وصف الأرض باستخدام الفعل العربي المحدد «دَحَّاها» (سورة النازعات 79:30)، وهو مصطلح جذري يشير إلى كل من المجال المكاني الموسع والشكل الممدود/المفلطح لبيضة النعامة، وهو ما يتوافق بدقة مع الفيزياء الفلكية الحديثة وقياسات الأقمار الصناعية التي تؤكد أن قوى الجاذبية تشوه الأرض لتصبح كروية مفلطحة.",
                        tr: "Kutsal Kitap’taki betimlemeler, sabit sütunlarla (1 Samuel 2:8), sarsılmaz bir yüzey (1 Tarihler 16:30), “dört köşe” (Vahiy 7:1) ve sağlam bir gök kubbesiyle (Eyüp 37:18) çerçevelenmiş ilkel, düz dünya kozmolojisini yansıtırken, bu metin modelleri ilahi her şeyi bilme özelliğinden ziyade 1. yüzyıl insanlarının varsayımlarını yansıtmaktadır Kuran ise, dünyayı belirli bir Arapça fiil olan Daḥāhā (An-Nazi'at Suresi 79:30) ile tanımlayarak ilahi bilimsel doğruluğu ortaya koymaktadır kullanarak ilahi bilimsel doğruluğunu ortaya koyar bu kök terim, hem genişlemiş bir uzamsal alanı hem de devekuşu yumurtasının uzun ve yassı şeklini ifade eder ve yerçekimi kuvvetlerinin dünyayı yassı bir küreye dönüştürdüğünü doğrulayan modern astrofizik ve uydu ölçümleriyle tam olarak örtüşür.",
                        de: "Während biblische Beschreibungen eine primitive Kosmologie einer flachen Erde vermitteln, die von festen Säulen (1. Samuel 2,8), einer unbeweglichen Oberfläche (1. Chronik 16,30), „vier Ecken“ (Offenbarung 7,1) und einer festen Himmelskuppel (Hiob 37,18), Textmodelle, die eher die menschlichen Annahmen des 1. Jahrhunderts widerspiegeln als göttliche Allwissenheit, demonstriert der Koran göttliche wissenschaftliche Genauigkeit, indem er die Erde mit dem spezifischen arabischen Verb „Daḥāhā“ (Sure An-Nazi’at 79,30) beschreibt, einem Stammwort, das sich sowohl auf ein ausgedehntes räumliches Feld als auch auf die längliche/abgeflachte Form eines Straußeneis bezieht und genau mit der modernen Astrophysik und Satellitenmessungen übereinstimmt, die bestätigen, dass Gravitationskräfte die Erde zu einem abgeflachten Sphäroid verformen."
                    },
                    20: {
                        en: "While Western media outlets frequently push Islamophobic narratives falsely portraying Muslims as unhygienic, Islam actually mandates an unparalleled standard of personal cleanliness, requiring mandatory water purification (Istinja) after using the toilet instead of relying solely on dry toilet paper like traditional Christian Westerners, alongside ritual washing (Wudu) performed up to five times daily before prayers and full body purification (Ghusl) immediately following intimate relations, establishing physical purity as an essential cornerstone of divine faith.",
                        ar: "في حين أن وسائل الإعلام الغربية غالبًا ما تروج لروايات معادية للإسلام تصور المسلمين زورًا على أنهم غير ملتزمين بالنظافة، إلا أن الإسلام في الواقع يفرض معايير لا مثيل لها في مجال النظافة الشخصية، حيث يقتضي تطهيرًا إلزاميًا بالماء (الاستنجاء) بعد استخدام المرحاض بدلاً من الاعتماد حصريًّا على ورق التواليت الجاف كما يفعل الغربيون المسيحيون التقليديون، إلى جانب الوضوء الذي يُؤدى حتى خمس مرات يوميًا قبل الصلاة، والغسل الكامل للجسم (الغسل) فورًا بعد الجماع، مما يجعل الطهارة الجسدية حجر الزاوية الأساسي للإيمان الإلهي.",
                        tr: "Batı medyası, Müslümanları haksız bir şekilde hijyenik olmayan kişiler olarak gösteren İslamofobik söylemleri sık sık yaygınlaştırırken, aslında İslam, benzersiz bir kişisel temizlik standardı empoze eder geleneksel Hıristiyan Batılılar gibi yalnızca kuru tuvalet kağıdına güvenmek yerine, tuvaleti kullandıktan sonra zorunlu suyla temizlik (istinja) yapılmasını şart koşar, bunun yanı sıra namazlardan önce günde beş defaya kadar yapılan ritüel yıkanma (vudu) ve cinsel ilişkiden hemen sonra yapılan tam vücut temizliği (gusül) ile fiziksel temizliği ilahi inancın temel bir köşesi olarak belirler.",
