                        tr: "Şüpheciler ve seküler eleştirmenler, uzun zamandır Kuran’ın ilahi kökenini, Allah’ın şu sözlerini içeren Kaf Suresi’ni (50:16) alay konusu yaparak sarsmaya çalışmaktadırlar: “Biz insanı yarattık ve ruhunun ona fısıldadıklarını biliyoruz, biz ona, boyun damarından daha yakınız” (Wa Naḥnu aqrabu ilayhi min ḥabli al-warīd) ifadesini alay konusu yaparak, oksijensiz kanı kalbe geri götüren bir kan damarına atıfta bulunmanın, insan düşünceleri, içsel fısıltılar ve bilişsel süreçlerle tıbbi açıdan ilgisiz olduğunu iddia etmişlerdir, ancak, modern nöroanatomi, iç juguler damarla tam olarak aynı lifli kılıf (karotis kılıfı) içinde ve ona paralel olarak uzanan Vagus sinirinin (kraniyal sinir X) bu sinir, beynin merkezi sinir sistemini kalbe, akciğerlere ve sindirim sistemine bağlayan başlıca sinir otoyoludur ve iç organ sinyallerini, duygusal stres tepkilerini ve bilinçaltı bilişsel durumları beyin ile vücut arasında sürekli olarak iletir. Dahası, iç juguler venin kendisi tüm beyin için birincil venöz drenaj yolunu sağlar, düşünce, duygu ve iç monologdan sorumlu serebral yarıkürelerden kanı doğrudan uzaklaştırarak, serebral işleme, sinirsel iletim ve juguler vasküler kompleks arasında mutlak ve vazgeçilmez bir anatomik yakınlık kurar. Yedinci yüzyılda izole bir Arabistan bölgesinde yaşayan okuma yazma bilmeyen bir adamın, düşünce işleme yolları ile juguler ven arasındaki yakın fizyolojik bağı anlayabilmesi için ne mikroskobik anatomik diseksiyon tekniklerine ne de nörovasküler haritalamaya sahip olması nedeniyle, bu kesin ilahi metafor, Kuran’ın yalnızca insan biyolojisini şekillendiren Her Şeyi Bilen Yaratıcı’dan kaynaklanabileceğini kanıtlayan bir başka inkar edilemez bilimsel mucize olarak karşımıza çıkmakta ve İslam’ın mutlak, değiştirilemez gerçek olduğunu bir kez daha kanıtlamaktadır.",
                        de: "Skeptiker und säkulare Kritiker versuchen seit langem, den göttlichen Ursprung des Korans zu untergraben, indem sie sich über die Sure Qaf (50:16) lustig machen, in der Allah sagt: „Und Wir haben den Menschen bereits erschaffen und wissen, was seine Seele ihm zuflüstert, und Wir sind ihm näher als seine Halsschlagader“ (Wa Naḥnu aqrabu ilayhi min ḥabli al-warīd), und behaupten, dass der Verweis auf ein Blutgefäß, das für den Rücktransport des sauerstoffarmen Blutes zum Herzen zuständig ist, medizinisch gesehen nichts mit menschlichen Gedanken, inneren Eingebungen und kognitiven Prozessen zu tun habe, jedoch hat die moderne Neuroanatomie diese voreilige Kritik vollständig widerlegt, indem sie aufzeigte, dass direkt parallel zur Vena jugularis interna und in genau derselben Faserschleuse (Karotisscheide) verlaufend der Vagusnerv (Hirnnerv X) verläuft, der primäre Nervenweg, der das zentrale Nervensystem des Gehirns mit dem Herzen, der Lunge und dem Verdauungstrakt verbindet und kontinuierlich viszerale Nervensignale, emotionale Stressreaktionen und unbewusste kognitive Zustände direkt zwischen Gehirn und Körper überträgt. Darüber hinaus stellt die innere Halsvene selbst den primären venösen Abflussweg für das gesamte Gehirn dar, sie leitet Blut direkt von den Großhirnhemisphären ab, die für das Denken, die Emotionen und den inneren Monolog zuständig sind, und schafft so eine absolute, unverzichtbare anatomische Nähe zwischen den zerebralen Verarbeitungsprozessen, der neuronalen Übertragung und dem jugulären Gefäßkomplex. Da ein ungebildeter Mann des siebten Jahrhunderts, der im isolierten Arabien lebte, weder über mikroskopische anatomische Präparationstechniken noch über neurovaskuläre Kartierungen verfügte, um den engen physiologischen Zusammenhang zwischen den Denkverarbeitungswegen und der Halsvene zu verstehen, stellt diese präzise göttliche Metapher ein weiteres unbestreitbares wissenschaftliches Wunder dar, das beweist, dass der Koran nur vom allwissenden Schöpfer stammen kann, der die menschliche Biologie geschaffen hat, und das einmal mehr beweist, dass der Islam die absolute, unveränderliche Wahrheit ist."
                    },
                    6: {
                        en: `Long before modern astrophysics formulated the Big Bang model or detected the accelerating expansion of space driven by dark energy, the Quran detailed the origin and dynamic stretching of the cosmos with breathtaking linguistic precision. In Surah Al-Anbiya (21:30), Allah declares, "Do not those who disbelieve see that the heavens and the earth were meshed together, then We ripped them apart?" where the Arabic word ratqan explicitly denotes a singular, tightly bound, compact unit, and the active verb fataqnāhumā signifies forceful separation by pulling material in opposing directions, a precise description of the initial cosmic singularity expanding outward to form spacetime and matter. Furthermore, while ancient mythologies and biblical texts conceptualized the sky as a static, rigid dome, Surah Adh-Dhariyat (51:47) proclaims, "And the heaven We constructed with power, and indeed, We are expanding it" (Wa-innā lamūsi'ūn), using an active Arabic participle that conveys continuous, ongoing expansion across time, perfectly mirroring Edwin Hubble's astronomical observations and contemporary measurements of dark energy stretching the cosmic fabric. It is rationally impossible for an unlettered man in seventh-century Arabia, lacking telescopes or mathematical cosmology, to have authored these insights, offering undeniable proof that the Quran is the divine revelation of the Creator who brought the universe into existence.`,
                        ar: "قبل وقت طويل من قيام الفيزياء الفلكية الحديثة بصياغة نموذج «الانفجار العظيم» أو اكتشاف التمدد المتسارع للفضاء مدفوعًا بالطاقة المظلمة، كان القرآن الكريم قد وصف بالتفصيل أصل الكون وتمددُه الديناميكي بدقة لغوية مذهلة. في سورة الأنبياء (21:30)، يقول الله تعالى: «أفلا يرى الكافرون أن السماوات والأرض كانتا متشابكتين، ثم فرقناهما؟» حيث تشير الكلمة العربية «راتقان» صراحةً إلى وحدة مفردة متماسكة ومتراصة، ويشير الفعل «فققناهما» إلى الفصل القوي عن طريق سحب المادة في اتجاهين متعاكسين، وهو وصف دقيق للانفجار الكوني الأولي الذي يتوسع إلى الخارج ليشكل الزمكان والمادة. علاوة على ذلك، في حين صورت الأساطير القديمة والنصوص التوراتية السماء على أنها قبة ثابتة وصلبة، فإن سورة الذاريات (51:47) تعلن: «والسماء التي بنيناها بقوة، وإننا نوسعها» (وإنّا لَمُوسِيُّون)، مستخدمةً صيغة الفعل المضارع المستمر التي تنقل التوسع المستمر والمتواصل عبر الزمن، مما يعكس تمامًا الملاحظات الفلكية لإدوين هابل والقياسات المعاصرة للطاقة المظلمة التي تمدّ النسيج الكوني. ومن المستحيل عقليًّا أن يكون رجل أمي في شبه الجزيرة العربية في القرن السابع، يفتقر إلى التلسكوبات أو علم الكونيات الرياضي، هو من صاغ هذه الرؤى، مما يقدم دليلاً لا يمكن إنكاره على أن القرآن هو الوحي الإلهي للخالق الذي أوجد الكون.",
                        tr: "Modern astrofizik, Büyük Patlama modelini formüle etmeden ya da karanlık enerjinin neden olduğu uzayın hızlanan genişlemesini tespit etmeden çok önce, Kuran, evrenin kökenini ve dinamik genişlemesini nefes kesici bir dilsel hassasiyetle ayrıntılı bir şekilde anlatmıştır. Enbiya Suresi’nde (21:30), Allah şöyle buyurur: “Kâfirler, göklerin ve yerin birbirine yapışık olduğunu, sonra da onları ayırdığımızı görmüyorlar mı?” Burada Arapça ‘ratqan’ kelimesi, tekil, sıkı bir şekilde birbirine bağlı, kompakt bir birimi açıkça ifade ederken, “fataqnāhumā” fiili, maddeyi zıt yönlere çekerek kuvvetli bir şekilde ayırmayı ifade eder, bu, uzay-zamanı ve maddeyi oluşturmak üzere dışa doğru genişleyen ilk kozmik tekilliğin kesin bir tanımlamasıdır. Dahası, eski mitolojiler ve İncil metinleri gökyüzünü statik, katı bir kubbe olarak kavramsallaştırırken, Adh-Dhariyat Suresi (51:47) şöyle bildirir: “Gökleri kudretle yarattık ve şüphesiz onu genişletiyoruz” (Wa-innā lamūsi'ūn) der, burada, zaman içinde sürekli ve devam eden bir genişlemeyi ifade eden aktif bir Arapça sıfat-fiil kullanılır, bu, Edwin Hubble’ın astronomik gözlemlerini ve kozmik dokuyu geren karanlık enerjinin güncel ölçümlerini mükemmel bir şekilde yansıtmaktadır. Teleskoplardan ve matematiksel kozmolojiden yoksun, yedinci yüzyıl Arabistan’ında okuma yazma bilmeyen bir adamın bu içgörülerde bulunması akıl olarak imkânsızdır, bu da Kuran’ın, evreni var eden Yaratıcı’nın ilahi vahyi olduğuna dair inkar edilemez bir kanıt sunmaktadır.",
                        de: "Lange bevor die moderne Astrophysik das Urknallmodell formulierte oder die durch dunkle Energie angetriebene beschleunigte Expansion des Raums nachwies, beschrieb der Koran den Ursprung und die dynamische Ausdehnung des Kosmos mit atemberaubender sprachlicher Präzision. In der Sure Al-Anbiya (21:30) erklärt Allah: „Sehen die Ungläubigen denn nicht, dass die Himmel und die Erde miteinander verflochten waren und Wir sie dann auseinandergerissen haben?“ Dabei bezeichnet das arabische Wort „ratqan“ ausdrücklich eine einzige, fest verbundene, kompakte Einheit, und das aktive Verb „fataqnāhumā“ bedeutet eine gewaltsame Trennung, indem Materie in entgegengesetzte Richtungen gezogen wird, eine präzise Beschreibung der anfänglichen kosmischen Singularität, die sich nach außen ausdehnt, um Raumzeit und Materie zu bilden. Während zudem antike Mythologien und biblische Texte den Himmel als statische, starre Kuppel konzeptualisierten, verkündet die Sure Adh-Dhariyat (51:47): „Und den Himmel haben Wir mit Macht erbaut, und wahrlich, Wir dehnen ihn aus“ (Wa-innā lamūsi'ūn), wobei ein aktives arabisches Partizip verwendet wird, das eine kontinuierliche, andauernde Ausdehnung über die Zeit hinweg vermittelt und Edwin Hubbles astronomische Beobachtungen sowie zeitgenössische Messungen der dunklen Energie, die das kosmische Gewebe ausdehnt, perfekt widerspiegelt. Es ist rational unmöglich, dass ein ungebildeter Mann im Arabien des siebten Jahrhunderts, dem sowohl Teleskope als auch mathematische Kosmologie fehlten, diese Erkenntnisse verfasst haben könnte, was einen unbestreitbaren Beweis dafür liefert, dass der Koran die göttliche Offenbarung des Schöpfers ist, der das Universum ins Dasein gebracht hat."
                    },
                    7: {
                        en: `Alongside cosmic mechanics and embryological accuracy, the Quran establishes an undeniable biological truth in Surah Al-Anbiya (21:30), declaring, "And We made from water every living thing (Wa ja'alnā mina al-mā'i kulla shay'in ḥayy), will they not then believe?" as well as in Surah An-Nur (24:45), stating, "Allah created every living creature from water," a profound scientific statement that directly anticipates modern cellular biochemistry and molecular biology. Today, biochemistry confirms that cytosol, the fluid matrix occupying the interior of every living cell across all kingdoms of life, consists of up to eighty percent water, serving as the essential aqueous solvent wherein metabolic reactions, protein folding, enzyme catalysis, and genetic replication occur, without this universal fluid medium, cell membranes cannot maintain integrity, DNA structures collapse, and biological life becomes physically impossible. In seventh-century Arabia, ancient medical traditions and philosophical schools attributed life to varied, incorrect combinations of fire, earth, air, or static blood, possessing no microscopic understanding that invisible cellular cytoplasm across plants, animals, and microscopic bacteria is composed fundamentally of water, thus, for an unlettered man in an arid desert environment to assert with absolute universality that every living organism without exception is constructed from water stands as an extraordinary empirical miracle, demonstrating beyond doubt that the Quran is the unalterable word of the Creator who designed the biological architecture of all living matter.`,
                        ar: "إلى جانب الميكانيكا الكونية والدقة في علم الأجنة، يثبت القرآن حقيقة بيولوجية لا يمكن إنكارها في سورة الأنبياء (21:30)، حيث يقول: «وَجَعَلْنَا مِنْ الْمَاءِ كُلَّ شَيْءٍ حَيٍّ (وَجَعَلۡنَا مِنَ ٱلۡمَآءِ كُلَّ شَيۡءٍ حَيِّۡ)، فهل لا يؤمنون؟» وكذلك في سورة النور (24:45)، حيث يقول: «خلق الله كل كائن حي من الماء»، وهو بيان علمي عميق يستبق بشكل مباشر علم الكيمياء الحيوية الخلوية وعلم الأحياء الجزيئي الحديثين. واليوم، تؤكد الكيمياء الحيوية أن السيتوسول، وهو المصفوفة السائلة التي تشغل الجزء الداخلي لكل خلية حية عبر جميع ممالك الحياة، يتكون من ما يصل إلى ثمانين في المائة من الماء، ويعمل كمذيب مائي أساسي تحدث فيه التفاعلات الأيضية، وطوي البروتينات، والتحفيز الإنزيمي، والتكاثر الجيني؛ وبدون هذا الوسط السائل الشامل، لا تستطيع أغشية الخلايا الحفاظ على سلامتها، وتنهار هياكل الحمض النووي (دنا)، وتصبح الحياة البيولوجية مستحيلة من الناحية الفيزيائية. في شبه الجزيرة العربية في القرن السابع، كانت التقاليد الطبية القديمة والمدارس الفلسفية تنسب الحياة إلى تركيبات متنوعة وخاطئة من النار، والأرض، والهواء، أو الدم الراكد، دون أن يكون لديهم أي فهم مجهري بأن السيتوبلازم الخلوي غير المرئي في النباتات والحيوانات والبكتيريا المجهرية يتكون أساسًا من الماء؛ وبالتالي، فإن قيام رجل أمي في بيئة صحراوية قاحلة بالتأكيد بشكل مطلق أن كل كائن حي دون استثناء مكون من الماء، يمثل معجزة تجريبية استثنائية، تثبت بما لا يدع مجالًا للشك أن القرآن هو كلام الخالق الذي لا يتغير، والذي صمم البنية البيولوجية لجميع الكائنات الحية.",
                        tr: "Kuran, kozmik mekanik ve embriyolojik doğruluğun yanı sıra, Enbiya Suresi’nde (21:30) yadsınamaz bir biyolojik gerçeği ortaya koyarak şöyle bildirir: “Ve biz her canlıyı sudan yarattık (Wa ja'alnā mina al-mā'i kulla shay'in ḥayy), öyleyse hâlâ inanmayacaklar mı?” Ayrıca Nur Suresi'nde (24:45) “Allah her canlıyı sudan yaratmıştır” diyerek, modern hücresel biyokimya ve moleküler biyolojiyi doğrudan öngören derin bir bilimsel ifadeye yer verir. Günümüzde biyokimya, tüm yaşam alemlerindeki her canlı hücrenin içini kaplayan sıvı matriks olan sitozolün yüzde seksene kadar sudan oluştuğunu doğrulamaktadır, sitozol, metabolik reaksiyonların, protein katlanmasının, enzim katalizinin ve genetik replikasyonun gerçekleştiği temel sulu çözücü görevi görür, bu evrensel sıvı ortam olmadan hücre zarları bütünlüğünü koruyamaz, DNA yapıları çöker ve biyolojik yaşam fiziksel olarak imkânsız hale gelir. Yedinci yüzyıl Arabistan’ında, eski tıp gelenekleri ve felsefe okulları, yaşamı ateş, toprak, hava veya durgun kan gibi çeşitli ve hatalı kombinasyonlara atfediyorlardı, bitkiler, hayvanlar ve mikroskobik bakterilerde bulunan görünmez hücresel sitoplazmanın temelde sudan oluştuğuna dair mikroskobik bir anlayışa sahip değillerdi. Dolayısıyla, kurak bir çöl ortamında yaşayan okuma yazma bilmeyen bir adamın, istisnasız her canlı organizmanın sudan oluştuğunu mutlak bir evrensellikle iddia etmesi, olağanüstü bir deneysel mucize olarak karşımıza çıkar ve Kuran’ın, tüm canlı maddenin biyolojik mimarisini tasarlayan Yaratıcı’nın değiştirilemez sözü olduğunu şüpheye yer bırakmayacak şekilde kanıtlar.",
                        de: "Neben kosmischer Mechanik und embryologischer Genauigkeit legt der Koran in der Sure Al-Anbiya (21:30) eine unbestreitbare biologische Wahrheit fest und erklärt: „Und Wir haben aus Wasser jedes Lebewesen erschaffen (Wa ja’alnā mina al-mā’i kulla shay’in ḥayy), wollen sie denn nicht glauben?“, sowie in der Sure An-Nur (24:45), wo es heißt: „Allah hat jedes Lebewesen aus Wasser erschaffen“, eine tiefgründige wissenschaftliche Aussage, die die moderne Zellbiochemie und Molekularbiologie direkt vorwegnimmt. Heute bestätigt die Biochemie, dass das Zytosol, die flüssige Matrix, die das Innere jeder lebenden Zelle in allen Lebensreichen ausfüllt, zu bis zu achtzig Prozent aus Wasser besteht und als das wesentliche wässrige Lösungsmittel dient, in dem Stoffwechselreaktionen, Proteinfaltung, Enzymkatalyse und genetische Replikation stattfinden, ohne dieses universelle flüssige Medium können Zellmembranen ihre Integrität nicht aufrechterhalten, DNA-Strukturen brechen zusammen und biologisches Leben wird physikalisch unmöglich. Im Arabien des siebten Jahrhunderts schrieben alte medizinische Traditionen und philosophische Schulen das Leben verschiedenen, falschen Kombinationen aus Feuer, Erde, Luft oder statischem Blut zu. Da ihnen jegliches mikroskopische Verständnis fehlte, dass das unsichtbare Zytoplasma von Pflanzen, Tieren und mikroskopisch kleinen Bakterien im Wesentlichen aus Wasser besteht, stellt die Behauptung eines ungebildeten Mannes in einer trockenen Wüstenumgebung, dass jeder lebende Organismus ausnahmslos aus Wasser besteht, ein außergewöhnliches empirisches Wunder dar und beweist zweifelsfrei, dass der Koran das unveränderliche Wort des Schöpfers ist, der die biologische Architektur aller lebenden Materie entworfen hat."
                    },
                    8: {
                        en: `Skeptics and materialist critics have historically dismissed religious descriptions of the sky as simple ancient poetic imagery, yet the Quran delivers a astonishing scientific disclosure regarding planetary physics in Surah Al-Anbiya (21:32), explicitly declaring, "And We made the sky a protected ceiling (Wa ja'alnā as-samā'a saqfan maḥfūẓā), while they turn away from its signs," an absolute scientific reality that modern atmospheric science and astrophysics have only recently verified. Earth's atmosphere serves as a multi-layered biological defensive shield: when space debris, asteroids, and meteoroids hyper-velocity enter our upper atmosphere at tens of thousands of miles per hour, rapid gas compression generates extreme thermal energy that incinerates the vast majority of extraterrestrial bombardment into harmless ash before reaching the surface, while simultaneously the stratospheric ozone layer filters lethal ultraviolet radiation and the magnetosphere deflects charged solar winds that would otherwise strip away liquid oceans and eradicate organic life. Ancient civilizations, lacking high-altitude physics, meteorology, and satellite telemetry, viewed the sky purely as an empty void or a static mystical canopy without understanding that invisible atmospheric gases form an active, life-preserving kinetic barrier against cosmic rays and meteoroid strikes, therefore, for an unlettered man in seventh-century desert Arabia to accurately characterize the sky specifically as a protective structural ceiling stands as a profound scientific miracle, proving beyond doubt that the Quran is the unalterable revelation of the Creator who designed Earth's atmospheric defenses to protect human life.`,
                        ar: "لطالما استخف المتشككون والنقاد الماديون تاريخياً بالأوصاف الدينية للسماء واعتبروها مجرد صور شعرية قديمة، إلا أن القرآن الكريم يقدم كشفاً علمياً مذهلاً بشأن فيزياء الكواكب في سورة الأنبياء (21:32)، حيث يعلن صراحةً: «وَجَعْلَنَا السَّمَاءَ سَقْفًا محفوظًا (وَجَعَلۡنَا ٱلسَّمَآءَ سَقۡفٗا مَّحۡفُوظٗا)، بينما يصدون عن آياتها»، وهي حقيقة علمية مطلقة لم تتحقق منها علوم الغلاف الجوي والفيزياء الفلكية الحديثة إلا مؤخرًا. يعمل الغلاف الجوي للأرض كدرع دفاعي بيولوجي متعدد الطبقات: فعندما تدخل الحطام الفضائي والكويكبات والنيازك بسرعة فائقة إلى الغلاف الجوي العلوي بسرعة تصل إلى عشرات الآلاف من الأميال في الساعة، يؤدي الانضغاط السريع للغاز إلى توليد طاقة حرارية هائلة تعمل على حرق الغالبية العظمى من القذائف الفضائية وتحويلها إلى رماد غير ضار قبل وصولها إلى السطح، بينما تقوم طبقة الأوزون في الستراتوسفير في الوقت نفسه بتصفية الأشعة فوق البنفسجية القاتلة، وتقوم المغنطيسية الأرضية بتحويل مسار الرياح الشمسية المشحونة التي كانت ستؤدي لولا ذلك إلى تجريد المحيطات من مياهها السائلة والقضاء على الحياة العضوية. كانت الحضارات القديمة، التي كانت تفتقر إلى معرفة فيزياء الارتفاعات العالية وعلم الأرصاد الجوية وقياس المسافات عن بُعد بالأقمار الصناعية، تنظر إلى السماء على أنها مجرد فراغ خالٍ أو مظلة صوفية ثابتة، دون أن تدرك أن الغازات الجوية غير المرئية تشكل حاجزًا حركيًّا نشطًا يحافظ على الحياة في مواجهة الأشعة الكونية وضربات النيازك، لذلك، فإن قيام رجل أمي في صحراء شبه الجزيرة العربية في القرن السابع الميلادي بتوصيف السماء بدقة على أنها سقف هيكلي وقائي يمثل معجزة علمية عميقة، تثبت بما لا يدع مجالاً للشك أن القرآن هو الوحي الثابت للخالق الذي صمم دفاعات الغلاف الجوي للأرض لحماية حياة البشر.",
                        tr: "Şüpheciler ve materyalist eleştirmenler, tarih boyunca gökyüzüne ilişkin dini betimlemeleri basit antik şiirsel imgeler olarak görmezden gelmişlerdir, ancak Kuran, Al-Enbiya Suresi’nde (21:32) gezegen fiziği konusunda şaşırtıcı bir bilimsel açıklama sunar ve açıkça şöyle belirtir: “Ve biz gökyüzünü korunan bir tavan yaptık (Wa ja'alnā as-samā'a saqfan maḥfūẓā), oysa onlar onun ayetlerinden yüz çevirirler,” modern atmosfer bilimi ve astrofizik tarafından ancak son zamanlarda doğrulanmış olan mutlak bir bilimsel gerçektir. Dünya'nın atmosferi, çok katmanlı bir biyolojik savunma kalkanı görevi görür: uzay enkazı, asteroitler ve meteoroitler saatte on binlerce mil hızla üst atmosferimize girdiğinde, hızlı gaz sıkışması aşırı termal enerji üretir, bu enerji, gezegen dışı bombardımanın büyük çoğunluğunu yüzeye ulaşmadan zararsız küle dönüştürür, aynı zamanda stratosferik ozon tabakası ölümcül ultraviyole radyasyonu filtreler ve manyetosfer, aksi takdirde sıvı okyanusları yok edip organik yaşamı ortadan kaldıracak yüklü güneş rüzgarlarını saptırır. Yüksek irtifa fiziği, meteoroloji ve uydu telemetrisi bilgisinden yoksun olan eski uygarlıklar, gökyüzünü tamamen boş bir boşluk ya da statik, mistik bir kubbe olarak görürlerdi, görünmez atmosferik gazların, kozmik ışınlara ve meteoroid çarpmalarına karşı aktif, yaşamı koruyan bir kinetik bariyer oluşturduğunu anlamamışlardı. bu nedenle, yedinci yüzyıl çöl Arabistan’ında okuma yazma bilmeyen bir adamın gökyüzünü özellikle koruyucu bir yapısal tavan olarak doğru bir şekilde tanımlaması, derin bir bilimsel mucize niteliğindedir ve Kuran’ın, insan yaşamını korumak için Dünya’nın atmosferik savunma sistemlerini tasarlayan Yaratıcı’nın değiştirilemez vahyi olduğunu şüpheye yer bırakmayacak şekilde kanıtlamaktadır.",
                        de: "Skeptiker und materialistische Kritiker haben religiöse Beschreibungen des Himmels in der Vergangenheit stets als bloße poetische Bilder der Antike abgetan, doch der Koran liefert in der Sure Al-Anbiya (21:32) eine erstaunliche wissenschaftliche Erkenntnis zur Planetenphysik und erklärt ausdrücklich: „Und Wir haben den Himmel zu einer geschützten Decke gemacht (Wa ja’alnā as-samā’a saqfan maḥfūẓā), während sie sich von seinen Zeichen abwenden“, eine unumstößliche wissenschaftliche Tatsache, die die moderne Atmosphärenwissenschaft und Astrophysik erst kürzlich bestätigt haben. Die Erdatmosphäre dient als vielschichtiger biologischer Schutzschild: Wenn Weltraummüll, Asteroiden und Meteoroiden mit extrem hoher Geschwindigkeit mit Zehntausenden von Meilen pro Stunde in unsere obere Atmosphäre eintreten, erzeugt die rasche Gasverdichtung extreme thermische Energie, die den Großteil des außerirdischen Beschusses zu harmloser Asche verbrennt, bevor er die Oberfläche erreicht, während gleichzeitig die stratosphärische Ozonschicht tödliche ultraviolette Strahlung filtert und die Magnetosphäre geladene Sonnenwinde ablenkt, die andernfalls die flüssigen Ozeane wegspülen und organisches Leben auslöschen würden. Alte Zivilisationen, denen Kenntnisse der Höhenphysik, der Meteorologie und der Satellitentelemetrie fehlten, betrachteten den Himmel lediglich als leere Leere oder als statisches, mystisches Gewölbe, ohne zu verstehen, dass unsichtbare atmosphärische Gase eine aktive, lebenserhaltende kinetische Barriere gegen kosmische Strahlung und Meteoroideneinschläge bilden, daher stellt es für einen ungebildeten Mann im Wüstenarabien des siebten Jahrhunderts ein tiefgreifendes wissenschaftliches Wunder dar, den Himmel genau als schützende strukturelle Decke zu charakterisieren, was zweifelsfrei beweist, dass der Koran die unverfälschte Offenbarung des Schöpfers ist, der die atmosphärischen Schutzmechanismen der Erde zum Schutz des menschlichen Lebens entworfen hat."
                    },
                    9: {
                        en: `A shallow, uninformed claim propagated by non-believers and hostile polemicists asserts that Muslims engage in idol worship (Shirk) by prostrating toward the Kaaba in Mecca, an accusation that reveals a complete ignorance of Islamic theology, historical practice, and the clear distinction between an object of worship and a focal direction of unity (Qibla), in Islam, the Kaaba, originally constructed by Prophets Ibrahim and Ismail as the first sanctuary dedicated exclusively to the pure, unadulterated worship of the One God, possesses no divine powers, grants no prayers, and retains zero inherent divinity, serving strictly as a geographic focal point toward which nearly two billion believers worldwide align simultaneously during their daily prayers (Salah) to establish cosmic order, global equality, and unbroken communal brotherhood under Allah. The Quran explicitly Commands Muslims to worship the Unseen Lord of the building rather than the stone structure itself, stating: "Let them worship the Lord of this House" (Surah Quraysh 106:3), a distinction reinforced historically during the life of Prophet Muhammad when his companion Bilal ibn Rabah stood directly on top of the Kaaba to recite the call to prayer (Athan), an action that would be an intolerable sacrilege in any genuine idol-worshipping tradition where idols are revered as gods, and further evidenced by the historical reality that if the physical Kaaba were destroyed, Muslims would continue prostrating toward its designated geographical coordinates without interruption, therefore, conflating a universal directional marker designed for organizational unity with pagan idol worship is a nonsensical misrepresentation, leaving Islam as the only uncompromisingly monotheistic faith that rejects all physical intermediaries, icons, and created objects in favor of direct supplication to the Almighty Creator.`,
                        ar: "هناك ادعاء سطحي وغير مستنير يروج له غير المؤمنين والمتجادلون المعادون، يزعم أن المسلمين يمارسون عبادة الأصنام (الشرك) من خلال السجود نحو الكعبة في مكة المكرمة، وهو اتهام يكشف عن جهل تام بعلم الكلام الإسلامي، والممارسات التاريخية، والتمييز الواضح بين موضوع العبادة واتجاه الوحدة (القبلة)، ففي الإسلام، لا تمتلك الكعبة، التي بناها في الأصل النبيان إبراهيم وإسماعيل كأول ملاذ مكرس حصريًّا للعبادة النقية الخالصة للإله الواحد، أي قوى إلهية، ولا تستجيب للصلاة، ولا تنطوي على أي ألوهية متأصلة، بل تعمل حصريًّا كنقطة محورية جغرافية يتجه نحوها ما يقرب من ملياري مؤمن حول العالم في وقت واحد أثناء صلواتهم اليومية (الصلاة) لإرساء النظام الكوني والمساواة العالمية والأخوة المجتمعية المتينة في ظل الله. ويأمر القرآن المسلمين صراحةً بعبادة الرب الغيب صاحب هذا المبنى بدلاً من الهيكل الحجري نفسه، حيث يقول: «فليعبدوا رب هذا البيت» (سورة قريش 106:3)، وهو تمييز تعززه الأحداث التاريخية خلال حياة النبي محمد عندما وقف رفيقه بلال بن ربة مباشرة فوق الكعبة لتلاوة الأذان، وهو فعل كان سيُعتبر تدنيسًا لا يُطاق في أي تقليد حقيقي لعبادة الأصنام حيث تُبجَّل الأصنام كآلهة، ويؤكد ذلك أيضًا الواقع التاريخي المتمثل في أنه لو دُمرت الكعبة المادية، لواصل المسلمون السجود باتجاه إحداثياتها الجغرافية المحددة دون انقطاع؛ ولذلك، فإن الخلط بين علامة اتجاه عالمية مصممة لتحقيق الوحدة التنظيمية وعبادة الأصنام الوثنية هو تحريف لا معنى له، مما يجعل الإسلام هو الدين التوحيدي الوحيد الذي لا يقبل أي تنازلات، ويرفض جميع الوسطاء الماديين والأيقونات والأشياء المخلوقة، مفضلاً الدعاء المباشر للخالق العظيم.",
                        tr: "İnanmayanlar ve düşmanca tavırlı polemikçiler tarafından yayılan sığ ve bilgisiz bir iddia, Müslümanların Mekke’deki Kabe’ye secde ederek putperestlik (Şirk) yaptıklarını öne sürmektedir, bu suçlama, İslam teolojisi, tarihsel uygulamalar ve ibadet nesnesi ile birlik yönü (Kıble) arasındaki açık ayrımı tam anlamıyla bilmemekten kaynaklanmaktadır. İslam’da, aslen İbrahim ve İsmail peygamberler tarafından tek Tanrı’ya adanmış saf ve katıksız ibadetin ilk mabedi olarak inşa edilen Kabe, hiçbir ilahi güce sahip değildir, duaları kabul etmez ve hiçbir içsel ilahilik barındırmaz, yalnızca, dünya çapında yaklaşık iki milyar inananın günlük namazlarında (Salaat) aynı anda yöneldikleri coğrafi bir odak noktası olarak hizmet eder, bu sayede Allah’ın huzurunda kozmik düzen, küresel eşitlik ve kesintisiz toplumsal kardeşlik tesis edilir. Kur’an-ı Kerim, Müslümanlara taş yapının kendisinden ziyade binanın Görünmez Rabbine ibadet etmelerini açıkça emreder ve şöyle der: “Bu Evin Rabbine ibadet etsinler” (Kureyş Suresi 106:3). Bu ayrım, Peygamber Muhammed’in hayattayken sahabesi Bilal ibn Rabah’ın Kabe’nin tepesine çıkarak ezanı okuduğu olayla tarihsel olarak pekiştirilmiştir, bu eylem, putların tanrı olarak saygı gördüğü herhangi bir gerçek putperestlik geleneğinde tahammül edilemez bir kutsal şeye saygısızlık olurdu, ve ayrıca, fiziksel Kabe yıkılsa bile Müslümanların kesintisiz bir şekilde belirlenen coğrafi koordinatlara doğru secde etmeye devam edecekleri tarihsel gerçeklikle de kanıtlanmıştır, dolayısıyla, örgütsel birlik için tasarlanmış evrensel bir yön belirleyicisini pagan put tapınımıyla birleştirmek anlamsız bir çarpıtmadır, bu da İslam’ı, Yüce Yaratıcı’ya doğrudan dua etmeyi tercih ederek tüm fiziksel aracıları, simgeleri ve yaratılmış nesneleri reddeden tek tavizsiz tek tanrılı inanç olarak bırakmaktadır.",
                        de: "Eine oberflächliche, uninformierte Behauptung, die von Ungläubigen und feindseligen Polemikern verbreitet wird, besagt, dass Muslime Götzenverehrung (Schirk) betreiben, indem sie sich in Richtung der Kaaba in Mekka niederwerfen, ein Vorwurf, der eine völlige Unkenntnis der islamischen Theologie, der historischen Praxis und der klaren Unterscheidung zwischen einem Gegenstand der Anbetung und einer Ausrichtung der Einheit (Qibla) offenbart. Im Islam besitzt die Kaaba, die ursprünglich von den Propheten Ibrahim und Ismail als erstes Heiligtum errichtet wurde, das ausschließlich der reinen, unverfälschten Anbetung des einen Gottes gewidmet ist, keine göttlichen Kräfte, erhört keine Gebete und besitzt keinerlei inhärente Göttlichkeit, sie dient ausschließlich als geografischer Bezugspunkt, auf den sich weltweit fast zwei Milliarden Gläubige während ihrer täglichen Gebete (Salah) gleichzeitig ausrichten, um kosmische Ordnung, globale Gleichheit und ungebrochene gemeinschaftliche Brüderlichkeit unter Allah herzustellen. Der Koran gebietet den Muslimen ausdrücklich, den unsichtbaren Herrn des Gebäudes anzubeten und nicht das Steinbauwerk selbst, indem er sagt: „Sie sollen den Herrn dieses Hauses anbeten“ (Sure al-Quraysch 106:3), eine Unterscheidung, die historisch bereits zu Lebzeiten des Propheten Muhammad bekräftigt wurde, als sein Gefährte Bilal ibn Rabah direkt auf der Kaaba stand, um den Gebetsruf (Adhan) zu verlesen, eine Handlung, die in jeder echten Götzenanbetungstradition, in der Götzen als Götter verehrt werden, ein unerträgliches Sakrileg darstellen würde, und die zudem durch die historische Tatsache belegt wird, dass Muslime, sollte die physische Kaaba zerstört werden, sich weiterhin ohne Unterbrechung in Richtung ihrer festgelegten geografischen Koordinaten niederwerfen würden, daher ist die Gleichsetzung eines universellen Richtungsmarkers, der der organisatorischen Einheit dient, mit heidnischer Götzenanbetung eine unsinnige Falschdarstellung, wodurch der Islam als der einzige kompromisslos monotheistische Glaube übrig bleibt, der alle physischen Vermittler, Ikonen und geschaffenen Objekte zugunsten der direkten Anrufung des allmächtigen Schöpfers ablehnt."
                    },
                    10: {
                        en: `The remarkable depth of Quranic scientific precision is further demonstrated in Surah Qaf (50:22), where Allah describes the physical transition of human perception as death approaches, proclaiming: "You were heedless of this, so We have removed from you your veil, and your sight today is iron" (Fa-baṣaruka al-yawma ḥadīd), a passage containing profound linguistic layers that directly intersect with modern cellular ophthalmology, while classical commentators recognized ḥadīd as signifying sharp or piercing vision as the spiritual realm is unveiled, the literal root term Ḥadīd explicitly means "iron," establishing an extraordinary physiological parallel to modern medical discoveries regarding Age-Related Macular Degeneration (AMD) and ocular pathology. Modern medical research confirms that excess iron homeostasis dysregulation within the retinal pigment epithelium leads to oxidative stress and iron accumulation in the macula, causing toxic cellular degradation and visual impairment in aging human populations, while simultaneously, the sudden breakdown of blood-retinal barriers during the agonal phase of mortality triggers rapid metabolic shifts, altered ocular perfusion, and micro-vascular changes that transform human perception. For an unlettered Prophet in seventh-century desert Arabia, possessing zero access to microscopic biochemistry, retinal histology, or hematological molecular pathways to directly associate the biological organ of human vision (Baṣar) with the element iron (Ḥadīd) at the threshold of death stands as yet another undeniable empirical miracle, proving once again that the Quran is the unalterable word of the Creator who designed human anatomy and governs the boundary between life and the afterlife.`,
                        ar: "ويتجلى العمق المذهل للدقة العلمية في القرآن الكريم مرة أخرى في سورة قاف (50:22)، حيث يصف الله التحول الجسدي لإدراك الإنسان مع اقتراب الموت، قائلاً: «وكنتم غافلين عن هذا، فرفعنا عنكم الحجاب، وبصركم اليوم حديد» (فبصركم اليوم حديد)، وهو نص يحتوي على طبقات لغوية عميقة تتقاطع بشكل مباشر مع طب العيون الخلوي الحديث، في حين أدرك المفسرون الكلاسيكيون أن كلمة «حديد» تشير إلى البصر الحاد أو الثاقب مع انكشاف العالم الروحي، إلا أن الجذر اللغوي «حديد» يعني حرفياً «الحديد»، مما يقيم تشابهاً فسيولوجياً استثنائياً مع الاكتشافات الطبية الحديثة المتعلقة بالتنكس البقعي المرتبط بالعمر (الضمور البقعي المرتبط بالعمر) وأمراض العين. تؤكد الأبحاث الطبية الحديثة أن الاضطراب المفرط في توازن الحديد داخل الظهارة الصبغية للشبكية يؤدي إلى الإجهاد التأكسدي وتراكم الحديد في البقعة، مما يتسبب في تدهور خلوي سام وضعف البصر لدى السكان المسنين، بينما في الوقت نفسه، يؤدي الانهيار المفاجئ للحواجز الدموية-الشبكية خلال المرحلة الاحتضارية من الموت إلى تحولات استقلابية سريعة، وتغيرات في تدفق الدم إلى العين، وتغيرات في الأوعية الدموية الدقيقة التي تغير الإدراك البشري. وبالنسبة لنبي أمي في صحراء شبه الجزيرة العربية في القرن السابع، الذي لم يكن لديه أي وصول إلى الكيمياء الحيوية المجهرية، أو علم أنسجة الشبكية، أو المسارات الجزيئية الدموية، ليربط بشكل مباشر بين العضو البيولوجي للرؤية البشرية (البصر) والعنصر الحديدي (الحديد) على عتبة الموت، يمثل معجزة تجريبية أخرى لا يمكن إنكارها، تثبت مرة أخرى أن القرآن هو كلام الخالق الذي لا يتغير، الذي صمم تشريح الإنسان ويحكم الحدود بين الحياة والآخرة.",
                        tr: "Kur’an’daki bilimsel kesinliğin olağanüstü derinliği, Kaf Suresi’nde (50:22) daha da açık bir şekilde ortaya konmaktadır. Bu ayette Allah, ölüm yaklaşırken insan algısının fiziksel dönüşümünü şöyle anlatmaktadır: “Bunu göz ardı ettiniz, bu yüzden üzerinizdeki perdeyi kaldırdık ve bugün görüşünüz demirdir” (Fa-baṣaruka al-yawma ḥadīd), Bu ayet, modern hücresel oftalmoloji ile doğrudan kesişen derin dilbilimsel katmanlar içerirken, klasik tefsirciler ḥadīd kelimesini manevi alemin perdesinin kalkmasıyla birlikte keskin veya delici bir görüş anlamına geldiği şeklinde yorumlamışlardır, ancak kelimenin kök anlamı olan Ḥadīd açıkça “demir” anlamına gelir ve bu da Yaşa Bağlı Makula Dejenerasyonu (AMD) ve göz patolojisiyle ilgili modern tıbbi keşiflerle olağanüstü bir fizyolojik paralellik kurmaktadır. Modern tıbbi araştırmalar, retina pigment epiteli içindeki aşırı demir homeostaz dengesizliğinin, makulada oksidatif strese ve demir birikimine yol açtığını, bu durumun yaşlanan insan popülasyonlarında toksik hücresel bozulmaya ve görme bozukluğuna neden olduğunu doğrulamaktadır, aynı zamanda, ölümün agonal aşamasında kan-retina bariyerlerinin ani çöküşü, hızlı metabolik değişimleri, göz kan akışında değişiklikleri ve insan algısını dönüştüren mikrovasküler değişiklikleri tetiklemektedir. Yedinci yüzyılın çöl Arabistan’ında, mikroskobik biyokimya konusunda hiçbir bilgisi olmayan okuma yazma bilmeyen bir Peygamber için, ölümün eşiğinde insan görme organını (Baṣar) demir (Ḥadīd) elementiyle doğrudan ilişkilendirebilmesi, yine inkar edilemez bir deneysel mucizedir ve Kuran’ın, insan anatomisini tasarlayan ve yaşam ile öbür dünya arasındaki sınırı belirleyen Yaratıcı’nın değiştirilemez sözü olduğunu bir kez daha kanıtlamaktadır.",
                        de: "Die bemerkenswerte Tiefe der wissenschaftlichen Präzision im Koran zeigt sich auch in der Sure Qaf (50:22), wo Allah den physischen Wandel der menschlichen Wahrnehmung im Angesicht des nahenden Todes beschreibt und verkündet: „Ihr wart euch dessen nicht bewusst, darum haben Wir den Schleier von euch genommen, und euer Blick ist heute wie Eisen“ (Fa-baṣaruka al-yawma ḥadīd), eine Passage, die tiefgründige sprachliche Ebenen enthält, die sich direkt mit der modernen zellulären Augenheilkunde überschneiden, während klassische Kommentatoren ḥadīd als Bezeichnung für scharfes oder durchdringendes Sehen interpretierten, wenn der spirituelle Bereich enthüllt wird, der wörtliche Stammbegriff Ḥadīd bedeutet jedoch ausdrücklich „Eisen“ und stellt damit eine außergewöhnliche physiologische Parallele zu modernen medizinischen Entdeckungen hinsichtlich der altersbedingten Makuladegeneration (AMD) und der Augenpathologie her. Die moderne medizinische Forschung bestätigt, dass eine übermäßige Dysregulation des Eisenhaushalts im retinalen Pigmentepithel zu oxidativem Stress und einer Eisenansammlung in der Makula führt, was bei alternden Bevölkerungsgruppen zu toxischem Zellabbau und Sehbeeinträchtigungen führt, während gleichzeitig der plötzliche Zusammenbruch der Blut-Netzhaut-Schranken in der agonalphase des Sterbens rasche Stoffwechselveränderungen, eine veränderte Augenperfusion und mikrovaskuläre Veränderungen auslöst, die die menschliche Wahrnehmung verändern. Für einen ungebildeten Propheten im Arabien des siebten Jahrhunderts, der keinerlei Zugang zu mikroskopischer Biochemie, die Netzhauthistologie oder die molekularen hämatologischen Signalwege, das biologische Organ des menschlichen Sehvermögens (Baṣar) an der Schwelle des Todes direkt mit dem Element Eisen (Ḥadīd) in Verbindung zu bringen, stellt ein weiteres unbestreitbares empirisches Wunder dar, das einmal mehr beweist, dass der Koran das unveränderliche Wort des Schöpfers ist, der die menschliche Anatomie entworfen hat und die Grenze zwischen Leben und Jenseits bestimmt."
                    },
                    11: {
                        en: `A favorite weapon of Islamophobic commentators and secular media outlets is the dishonest conflation of localized political authoritarianism, such as state-enforced mandates requiring face veils (Niqab) or the systematic denial of female education in modern Afghanistan with authentic Islamic jurisprudence (Sharia), weaponizing regional cultural practices to smear the universal divine order while deliberately ignoring Islam's absolute prohibition of religious coercion as explicitly codified in Surah Al-Baqarah (2:256): "There shall be no compulsion in religion" (Lā ikrāha fī ad-dīn). In stark contrast to the oppressive tribal policies or cultural edicts of modern nation-states, true Islamic law revolutionized human civilization fourteen centuries ago by granting women full legal personhood, independent financial ownership, inviolable inheritance rights (Surah An-Nisa 4:7), the absolute right to choose or reject marriage partners without family coercion, and the sacred obligation to seek higher knowledge, as explicitly commanded by Prophet Muhammad: "Seeking knowledge is an obligation upon every Muslim", a universal mandate that applied equally to men and women and produced foundational historical figures like Khadijah bint Khuwaylid, a premier merchant who financed early Islam, and Aisha bint Abi Bakr, a master scholar of law, medicine, and theology who taught the leading male companions of the Prophet. While Western nations treated women as chattel without property rights until the late nineteenth century, Islam established woman's spiritual equality before God fourteen hundred years ago (Surah Al-Ahzab 33:35), proving that state-sponsored coercion and cultural suppression are human aberrations that violate authentic Islamic teachings, leaving Islam as the divine truth that elevates, honors, and preserves the dignity of women above all man-made political ideologies.`,
                        ar: "من الأسلحة المفضلة لدى المعلقين المعادين للإسلام ووسائل الإعلام العلمانية الخلط غير النزيه بين الاستبداد السياسي المحلي، مثل الإجراءات التي تفرضها الدولة بإلزام ارتداء النقاب أو الحرمان المنهجي للفتيات من التعليم في أفغانستان الحديثة، وبين الفقه الإسلامي الأصيل (الشريعة)، مستغلين الممارسات الثقافية الإقليمية كسلاح لتشويه النظام الإلهي الشامل، بينما يتجاهلون عمدًا حظر الإسلام المطلق للإكراه الديني، كما هو منصوص عليه صراحةً في سورة البقرة (2:256): «لا إكراه في الدين» (لا إكراه في الدين). وعلى النقيض تمامًا من السياسات القبلية القمعية أو المراسيم الثقافية للدول القومية الحديثة، أحدث الشريعة الإسلامية الحقيقية ثورة في الحضارة الإنسانية منذ أربعة عشر قرنًا من خلال منح النساء الشخصية الاعتبارية الكاملة، والملكية المالية المستقلة، وحقوق الميراث التي لا يمكن انتهاكها (سورة النساء 4:7)، والحق المطلق في اختيار أو رفض شريك الزواج دون إكراه من الأسرة، والواجب المقدس في السعي وراء العلم العالي، كما أمر بذلك صراحةً النبي محمد: «البحث عن العلم فريضة على كل مسلم»، وهو أمر عالمي ينطبق بالتساوي على الرجال والنساء، وأسفر عن ظهور شخصيات تاريخية تأسيسية مثل خديجة بنت خويلد، وهي تاجرة بارزة مولت الإسلام في بداياته، وعائشة بنت أبي بكر، وهي عالمة بارعة في الفقه والطب واللاهوت، قامت بتعليم كبار الصحابة من الرجال. في حين كانت الدول الغربية تعامل النساء كأملاك لا حقوق ملكية لهن حتى أواخر القرن التاسع عشر، أرسى الإسلام المساواة الروحية للمرأة أمام الله منذ أربعة عشر قرناً (سورة الأحزاب 33:35)، مما يثبت أن الإكراه الذي ترعاه الدولة والقمع الثقافي هما انحرافان إنسانيان ينتهكان التعاليم الإسلامية الأصيلة، تاركين الإسلام كالحقيقة الإلهية التي ترفع كرامة المرأة وتكرمها وتحافظ عليها فوق كل الأيديولوجيات السياسية التي صنعها الإنسان.",
                        tr: "İslamofobik yorumcuların ve seküler medya kuruluşlarının en sevdiği silah, devletin zorla uyguladığı yüz peçesi (niqab) zorunluluğu ya da modern Afganistan’da kadınların eğitimine sistematik olarak engel olunması gibi yerel siyasi otoriterlik uygulamalarını, otantik İslam hukuku (Şeriat) ile aldatıcı bir şekilde bir tutmaktır, Böylece bölgesel kültürel uygulamaları, evrensel ilahi düzeni karalamak için bir silah olarak kullanırken, Al-Baqarah Suresi’nde (2:256) açıkça belirtildiği üzere İslam’ın dini zorlamayı mutlak olarak yasakladığını kasten görmezden geliyorlar: “Dinde zorlama yoktur” (Lā ikrāha fī ad-dīn). Modern ulus devletlerin baskıcı kabile politikaları veya kültürel emirleriyle tam bir tezat oluşturan gerçek İslam hukuku, on dört yüzyıl önce kadınlara tam tüzel kişilik, bağımsız mali mülkiyet, dokunulmaz miras hakları (Nisa Suresi 4:7), aile baskısı olmaksızın evlilik eşini seçme veya reddetme mutlak hakkı ve Peygamber Muhammed’in açıkça emrettiği gibi daha yüksek bilgiyi arama kutsal yükümlülüğünü tanıyarak insan uygarlığında devrim yarattı: “İlim aramak her Müslümanın yükümlülüğüdür”, bu, erkeklere ve kadınlara eşit şekilde uygulanan evrensel bir emirdir ve erken dönem İslam’a finansal destek sağlayan önde gelen bir tüccar olan Hatice bint Khuwaylid ile Peygamber’in önde gelen erkek sahabelerine ders veren hukuk, tıp ve ilahiyat ustası Aisha bint Abi Bakr gibi temel tarihi şahsiyetlerin ortaya çıkmasını sağlamıştır. Batı ülkeleri on dokuzuncu yüzyılın sonlarına kadar kadınları mülkiyet hakları olmayan birer mal gibi muamele ederken, İslam on dört yüz yıl önce kadının Tanrı huzurundaki manevi eşitliğini tesis etmiştir (Ahzab Suresi 33:35). Bu da, devletin desteklediği zorlama ve kültürel baskıların, otantik İslam öğretilerini ihlal eden insani sapmalar olduğunu kanıtlamakta ve İslam’ı, kadınların haysiyetini tüm insan yapımı siyasi ideolojilerin üstünde yücelten, onurlandıran ve koruyan ilahi gerçek olarak ortaya koymaktadır.",
                        de: "Eine beliebte Waffe islamfeindlicher Kommentatoren und säkularer Medien ist die unredliche Vermischung von lokal begrenztem politischem Autoritarismus, wie staatlich erzwungene Vorschriften zum Tragen von Gesichtsschleiern (Niqab) oder die systematische Verweigerung der Bildung für Frauen im modernen Afghanistan, mit der authentischen islamischen Rechtswissenschaft (Scharia), wobei regionale kulturelle Praktiken als Waffe eingesetzt werden, um die universelle göttliche Ordnung zu diffamieren, während das absolute Verbot religiöser Nötigung im Islam, wie es in der Sure Al-Baqarah (2:256) ausdrücklich festgeschrieben ist, bewusst ignoriert wird: „Es darf keinen Zwang in der Religion geben“ (Lā ikrāha fī ad-dīn). Im krassen Gegensatz zu den unterdrückerischen Stammespolitiken oder kulturellen Verordnungen moderner Nationalstaaten revolutionierte das wahre islamische Recht vor vierzehn Jahrhunderten die menschliche Zivilisation, indem es Frauen volle Rechtspersönlichkeit, unabhängiges Eigentumsrecht, unantastbare Erbrechte (Sure An-Nisa 4:7), das uneingeschränkte Recht, Ehepartner ohne familiären Zwang zu wählen oder abzulehnen, sowie die heilige Verpflichtung zum Streben nach höherem Wissen gewährte, wie es vom Propheten Muhammad ausdrücklich geboten wurde: „Das Streben nach Wissen ist eine Pflicht für jeden Muslim“, ein universeller Auftrag, der gleichermaßen für Männer und Frauen galt und wegweisende historische Persönlichkeiten hervorbrachte wie Khadijah bint Khuwaylid, eine führende Kauffrau, die den frühen Islam finanzierte, und Aisha bint Abi Bakr, eine Meisterin der Rechtswissenschaften, Medizin und Theologie, die die führenden männlichen Gefährten des Propheten unterrichtete. Während westliche Nationen Frauen bis ins späte 19. Jahrhundert als Eigentum ohne Eigentumsrechte behandelten, hat der Islam bereits vor vierzehnhundert Jahren die spirituelle Gleichheit der Frau vor Gott festgeschrieben (Sure Al-Ahzab 33:35) und damit bewiesen, dass staatlich geförderter Zwang und kulturelle Unterdrückung menschliche Verirrungen sind, die gegen authentische islamische Lehren verstoßen, wodurch der Islam als die göttliche Wahrheit dasteht, die die Würde der Frau über alle von Menschen geschaffenen politischen Ideologien erhebt, ehrt und bewahrt."
                    },
                    12: {
                        en: `For centuries, ancient philosophers and materialist skeptics viewed clouds as completely weightless, floaty vapors similar to hollow mist or hot air, assuming that if clouds possessed any actual physical mass, gravity would instantly pull them crashing to the ground, however, the Quran contains a profound scientific revelation regarding atmospheric physics in Surah Ar-Ra'd (13:12), declaring: "It is He who shows you lightning, causing fear and hope, and produces the heavy clouds" (Wa yunshi'u as-saḥāba ath-thiqāl), specifically utilizing the Arabic term Thiqāl, the literal plural of Thaqīl, meaning heavy, massive, or burdened with weight, which has been completely vindicated by modern meteorological science. Modern atmospheric calculations, such as those conducted by the United States Geological Survey (USGS), confirm that a standard, average-sized cumulus cloud floating overhead contains roughly 500,000 kilograms (over 1.1 million pounds or 550 tons) of suspended water droplets, an immense mass equivalent to over one hundred elephants floating in the sky, which remains suspended solely because thermal updrafts and atmospheric buoyant density spread this massive weight across a vast volume of air. Furthermore, storm-bearing cumulonimbus clouds carry millions of tons of water mass before precipitation occurs. In seventh-century desert Arabia, where humans possessed zero understanding of cloud volume metrics, atmospheric pressure differentials, or airborne water-mass calculations, declaring that soft overhead clouds are physically "heavy" shatters any possibility of human guess work or ancient mythic origin. This empirical alignment with modern physics proves beyond doubt that the Quran could only be revealed by the Almighty Creator who designed the water cycle and governs the physical laws of the universe.`,
                        ar: "على مدى قرون، كان الفلاسفة القدماء والمتشككون الماديون ينظرون إلى السحب على أنها أبخرة خالية تمامًا من الوزن، تطفو في الهواء، شبيهة بالضباب المجوف أو الهواء الساخن، مفترضين أنه لو كانت السحب تمتلك أي كتلة فيزيائية فعلية، لكان الجاذبية قد جذبتها على الفور لتسقط على الأرض. غير أن القرآن الكريم يتضمن وحيًا علميًا عميقًا بشأن فيزياء الغلاف الجوي في سورة الرعد (13:12)، حيث يقول: «وهو الذي يريكم البرق فينشر الخوف والأمل، ويُنشئ السحاب الثقيل» (وَيُنشِئُ السَّحَابَ الثِّقَالَ)، مستخدمًا على وجه التحديد المصطلح العربي «ثِّقَال»، وهو جمع «ثَقِيل» الذي يعني الثقيل أو الضخم أو المثقل بالوزن، وهو ما أثبتت صحته تمامًا علوم الأرصاد الجوية الحديثة. وتؤكد الحسابات الجوية الحديثة، مثل تلك التي أجرتها هيئة المسح الجيولوجي الأمريكية (USGS)، تؤكد أن سحابة كومولوس عادية متوسطة الحجم تطفو في السماء تحتوي على ما يقارب 500,000 كيلوغرام (أكثر من 1.1 مليون رطل أو 550 طنًا) من قطرات الماء العالقة، وهي كتلة هائلة تعادل أكثر من مائة فيل تطفو في السماء، وتظل معلقة فقط لأن التيارات الصاعدة الحرارية وكثافة الطفو الجوي توزعان هذا الوزن الهائل على حجم هائل من الهواء. علاوة على ذلك، تحمل السحب الركامية الماطرة التي تجلب العواصف ملايين الأطنان من كتلة الماء قبل حدوث هطول الأمطار. في شبه الجزيرة العربية الصحراوية في القرن السابع، حيث لم يكن لدى البشر أي فهم لمقاييس حجم السحب، أو فروق الضغط الجوي، أو حسابات الكتلة المائية المحمولة جواً، فإن القول بأن السحب الرقيقة المعلقة في السماء «ثقيلة» من الناحية الفيزيائية يقضي على أي احتمال للتخمين البشري أو الأصل الأسطوري القديم. ويثبت هذا التوافق التجريبي مع الفيزياء الحديثة بما لا يدع مجالاً للشك أن القرآن لا يمكن أن يكون قد نزل إلا عن الخالق العظيم الذي صمم دورة الماء ويحكم القوانين الفيزيائية للكون.",
                        tr: "Yüzyıllar boyunca, antik filozoflar ve materyalist şüpheciler bulutları, içi boş sis veya sıcak havaya benzeyen, tamamen ağırlıksız, havada süzülen buharlar olarak görmüşlerdi, bulutların gerçek bir fiziksel kütleye sahip olması durumunda yerçekiminin onları anında yere çakılmaya zorlayacağını varsayıyorlardı. Oysa Kur’an-ı Kerim, Ar-Ra’d Suresi’nde (13:12) atmosfer fiziğine dair derin bir bilimsel vahiy içerir ve şöyle bildirir: “O, size korku ve umut uyandıran şimşekleri gösteren ve ağır bulutları (Wa yunshi'u as-saḥāba ath-thiqāl) yaratan O’dur.” Burada özellikle, “ağır”, “kütleli” veya “ağırlıkla yüklü” anlamına gelen “Thaqīl” kelimesinin çoğul hali olan “Thiqāl” terimi kullanılmıştır ve bu, modern meteoroloji bilimi tarafından tamamen doğrulanmıştır. Amerika Birleşik Devletleri Jeoloji Araştırmaları Kurumu (USGS) tarafından yapılan modern atmosferik hesaplamalar, başımızın üzerinde süzülen standart, ortalama büyüklükteki bir kümülüs bulutunun yaklaşık 500.000 kilogram (1,1 milyondan fazla pound veya 550 ton) askıda su damlacığı içerdiğini doğrulamaktadır, bu, gökyüzünde yüzen yüzden fazla file eşdeğer devasa bir kütledir ve bu muazzam ağırlık, yalnızca termal yukarı akımlar ve atmosferik kaldırma kuvveti yoğunluğu sayesinde geniş bir hava hacmine yayıldığı için havada asılı kalmaktadır. Dahası, fırtına getiren kümülonimbus bulutları, yağış gerçekleşmeden önce milyonlarca ton su kütlesi taşır. İnsanların bulut hacmi ölçüleri, atmosferik basınç farkları veya havadaki su kütlesi hesaplamaları konusunda hiçbir bilgisi olmadığı yedinci yüzyılın çöl Arabistan’ında, başımızın üstündeki yumuşak bulutların fiziksel olarak “ağır” olduğunu belirtmek, insan tahminlerinin ya da eski mitolojik kökenli açıklamaların her türlü olasılığını ortadan kaldırır. Modern fizikle olan bu deneysel uyum, Kuran’ın ancak su döngüsünü tasarlayan ve evrenin fiziksel kanunlarını yöneten Yüce Yaratıcı tarafından indirilebileceğini şüpheye yer bırakmayacak şekilde kanıtlar.",
                        de: "Jahrhundertelang betrachteten antike Philosophen und materialistische Skeptiker Wolken als völlig schwerelose, schwebende Dämpfe, ähnlich wie hohler Nebel oder heiße Luft, und gingen davon aus, dass die Schwerkraft die Wolken sofort zu Boden reißen würde, wenn sie tatsächlich eine physikalische Masse besäßen. Der Koran enthält jedoch in der Sure Ar-Ra'd (13:12) eine tiefgründige wissenschaftliche Offenbarung zur Physik der Atmosphäre, in der es heißt: „Er ist es, der euch den Blitz zeigt, der Furcht und Hoffnung hervorruft, und der die schweren Wolken hervorbringt“ (Wa yunshi'u as-saḥāba ath-thiqāl), wobei ausdrücklich der arabische Begriff „Thiqāl“ verwendet wird, der wörtliche Plural von „Thaqīl“, was „schwer“, „massiv“ oder „mit Gewicht belastet“ bedeutet, eine Aussage, die von der modernen Meteorologie vollständig bestätigt wurde. Moderne atmosphärische Berechnungen, wie sie beispielsweise vom United States Geological Survey (USGS), bestätigen, dass eine normale, durchschnittlich große Cumuluswolke, die über uns schwebt, etwa 500.000 Kilogramm (über 1,1 Millionen Pfund oder 550 Tonnen) schwebender Wassertropfen enthält, eine immense Masse, die mehr als hundert im Himmel schwebenden Elefanten entspricht und die nur deshalb in der Schwebe bleibt, weil thermische Aufwinde und die atmosphärische Auftriebsdichte dieses enorme Gewicht auf ein riesiges Luftvolumen verteilen. Darüber hinaus transportieren sturmbringende Cumulonimbus-Wolken Millionen Tonnen an Wassermasse, bevor es zum Niederschlag kommt. In der Wüste Arabiens des siebten Jahrhunderts, wo die Menschen keinerlei Verständnis für die Messung von Wolkenvolumina, atmosphärische Druckunterschiede oder die Berechnung von Wassermasse in der Luft hatten, widerlegt die Feststellung, dass die weichen Wolken über uns physikalisch „schwer“ sind, jede Möglichkeit menschlicher Spekulationen oder eines mythischen Ursprungs aus alter Zeit. Diese empirische Übereinstimmung mit der modernen Physik beweist zweifelsfrei, dass der Koran nur vom allmächtigen Schöpfer offenbart worden sein kann, der den Wasserkreislauf entworfen hat und die physikalischen Gesetze des Universums regelt."

        const sourcesData = [
            { title: "All the Miracles of Quran", url: "https://www.miracles-of-quran.com/", category: "Islamic Sources" },
            { title: "The Quran", url: "https://quran.com", category: "Islamic Sources" },

        ];

        const sourceCategoryTranslations = {
            en: {
                "Islamic Sources": "Islamic Sources",
                "Other Scriptures": "Other Scriptures",
                "Translation": "Translation"
            },
            tr: {
                "Islamic Sources": "İslami Kaynaklar",

                "Translation": "Çeviri"
            },
            de: {
                "Islamic Sources": "Islamische Quellen",

                "Translation": "Übersetzung"
            },
            ar: {
                "Islamic Sources": "المصادر الإسلامية",
                "Other Scriptures": "الكتب المقدسة الأخرى",
                "Translation": "الترجمة"
            }
        };

        function getSourceCategory(category) {
            const translations = sourceCategoryTranslations[uiLang] || sourceCategoryTranslations.en;
            return translations[category] || category;
        }

        let currentChapter = 1;
        let currentPage = 1;

        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        function renderSources() {
            const list = document.getElementById('sources-list');
            const t = Object.assign({}, uiStrings.en, uiStrings[uiLang] || {});
            const countEl = document.getElementById('sources-count-text');

            if (!sourcesData.length) {
                countEl.innerText = '';
                list.innerHTML = '<p class="sources-empty">' + t.sourcesEmpty + '</p>';
                return;
            }

            countEl.innerText = t.sourcesCount.replace('{count}', sourcesData.length);

            const categories = [];
            const grouped = {};
            sourcesData.forEach(function(src) {
                const cat = src.category || t.sourcesTitle;
                const translatedCat = getSourceCategory(cat);

                if (!grouped[translatedCat]) {
                    grouped[translatedCat] = [];
                    categories.push(translatedCat);
                }

                grouped[translatedCat].push(src);
            });

            const arrowIcon = `
                <svg class="source-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
            `;

            list.innerHTML = categories.map(function(cat) {
                const items = grouped[cat].map(function(src) {
                    let hostname = '';
                    try {
                        hostname = new URL(src.url).hostname;
                    } catch (e) {
                        hostname = '';
                    }
                    const iconUrl = hostname
                        ? 'https://www.google.com/s2/favicons?sz=64&domain=' + hostname
                        : '';
                    return `
                        <a class="source-item" href="${src.url}" target="_blank" rel="noopener noreferrer">
                            <img class="source-favicon" src="${iconUrl}" alt="" onerror="this.style.visibility='hidden'">
                            <div class="source-info">
                                <div class="source-title">${src.title}</div>
                                <div class="source-url">${hostname || src.url}</div>
                            </div>
                            ${arrowIcon}
                        </a>
                    `;
                }).join('');

                return `
                    <div class="sources-category">
                        <div class="sources-category-label">${cat}</div>
                        <div class="sources-grid">${items}</div>
                    </div>
                `;
            }).join('');
        }

        function showSourcesPage() {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('reader-view').classList.add('hidden');
            document.getElementById('sources-page').classList.remove('hidden');
            document.querySelectorAll('.chapter-list button').forEach(function(btn) {
                btn.classList.remove('active');
            });
            renderSources();
        }

        function updateHashSilently(chap, page) {
            const newHash = '#' + chap + ':' + page;
            if (location.hash !== newHash) {
                history.replaceState(null, '', newHash);
            }
        }

        function downloadBookPDF() {
            const printArea = document.getElementById('print-area');
            const author = "Furkan Selim Kucukaslan";
            const t = uiStrings[uiLang] || uiStrings.en;

            let html = `
                <div class="print-title-page">
                    <img src="https://kitabalfurqan.github.io/furqan.png" alt="Kitab Al-Furqan" class="print-title-image">
                    <h1>Kitab Al-Furqan</h1>
                    <p class="print-author">${t.byAuthor} ${author}</p>
                </div>
                <div class="print-toc-page">
                    <h2>${t.tableOfContents}</h2>
            `;

            Object.keys(bookData).forEach(function(chapNum) {
                html += `<div class="print-toc-item">${chapNum}. ${bookData[chapNum].title}</div>`;
            });

            html += `</div>`;

            Object.keys(bookData).forEach(function(chapNum) {
                const chapter = bookData[chapNum];
                html += `<div class="print-chapter-title">${chapter.title}</div>`;
                html += `<div class="print-basmala">﷽</div>`;

                Object.keys(chapter.pages).forEach(function(pgNum) {
                    const passage = chapter.pages[pgNum];
                    if (!passage.en) return;
                    html += `
                        <div class="print-passage">
                            <div class="print-ref">${chapNum}:${pgNum}</div>
                            <div class="print-ar">${toArabicDigits(passage.ar)}</div>
                            <div class="print-en">${getTranslationText(passage)}</div>
                        </div>
                    `;
                });
            });

            printArea.innerHTML = html;
            document.title = 'Kitab Al-Furqan - Full Book';
            window.print();
        }

        function sharePage() {
            const url = location.origin + location.pathname + '#' + currentChapter + ':' + currentPage;
            const t = uiStrings[uiLang] || uiStrings.en;
            const isMobile = window.matchMedia('(max-width: 768px)').matches;

            if (isMobile && navigator.share) {
                navigator.share({ url: url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => alert(t.copied));
            } else {
                prompt("Copy link:", url);
            }
        }

        function loadFromHash() {
            const hash = location.hash.replace('#', '');
            const parts = hash.split(':');
            if (parts.length === 2) {
                const chap = parseInt(parts[0]);
                const pg = parseInt(parts[1]);
                if (bookData[chap] && bookData[chap].pages[pg]) {
                    currentChapter = chap;
                    currentPage = pg;
                    return true;
                }
            }
            return false;
        }

        const supportedContentLangs = ['en', 'tr', 'de'];
        const supportedUILangs = ['en', 'tr', 'de', 'ar'];
        const rawLang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
        const userLang = supportedContentLangs.includes(rawLang) ? rawLang : 'en';
        const uiLang = supportedUILangs.includes(rawLang) ? rawLang : 'en';

        function getTranslationText(passage) {
            return passage[userLang] || passage.en;
        }

        function toArabicDigits(str) {
            if (!str) return str;
            const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return str.replace(/[0-9]/g, d => arabicDigits[d]);
        }

        const uiStrings = {
            en: { tagline: "Book of Proof", goTo: "Go to:", go: "Go", previous: "Previous", next: "Next", share: "Share", copied: "Link copied!", notFound: "Reference not found! Use format Chapter:Page (e.g. 1:2 or 2:1)", homeText: "An Islamic book exploring the evidences and arguments for the faith. Browse chapters from the menu, or press \"Start Reading\" to begin from the first page.", homeBtn: "Start Reading", searchPlaceholder: "Search a word or chapter...", noResults: "No results found.", chapterMatch: "Chapter match:", byAuthor: "By", tableOfContents: "Table of Contents", sourcesTitle: "Sources", sourcesTagline: "Where the information in this book comes from", sourcesBack: "Back to Home", sourcesEmpty: "No sources added yet.",sourcesCount: "{count} references",  },
            tr: { tagline: "Delil Kitabı", goTo: "Git:", go: "Git", previous: "Önceki", next: "Sonraki", share: "Paylaş", copied: "Bağlantı kopyalandı!", notFound: "Referans bulunamadı! Bölüm:Sayfa biçimini kullanın (örn. 1:2 veya 2:1)", homeText: "İmana dair delilleri ve argümanları inceleyen İslami bir kitap. Menüden bölümlere göz atabilir veya ilk sayfadan başlamak için \"Okumaya Başla\" düğmesine basabilirsiniz.", homeBtn: "Okumaya Başla", searchPlaceholder: "Bir kelime veya bölüm ara...", noResults: "Sonuç bulunamadı.", chapterMatch: "Bölüm eşleşmesi:", byAuthor: "Yazar", tableOfContents: "İçindekiler", sourcesTitle: "Kaynaklar", sourcesTagline: "Bu kitaptaki bilgilerin kaynakları", sourcesBack: "Ana Sayfaya Dön", sourcesEmpty: "Henüz kaynak eklenmedi.", sourcesCount: "{count} kaynak" },
            de: { tagline: "Buch des Beweises", goTo: "Gehe zu:", go: "Los", previous: "Zurück", next: "Weiter", share: "Teilen", copied: "Link kopiert!", notFound: "Referenz nicht gefunden! Verwenden Sie das Format Kapitel:Seite (z. B. 1:2 oder 2:1)", homeText: "Ein islamisches Buch, das die Beweise und Argumente für den Glauben untersucht. Durchsuchen Sie die Kapitel über das Menü oder klicken Sie auf \"Lesen beginnen\", um auf der ersten Seite zu starten.", homeBtn: "Lesen beginnen", searchPlaceholder: "Ein Wort oder Kapitel suchen...", noResults: "Keine Ergebnisse gefunden.", chapterMatch: "Kapitelübereinstimmung:", byAuthor: "Von", tableOfContents: "Inhaltsverzeichnis", sourcesTitle: "Quellen", sourcesTagline: "Woher die Informationen in diesem Buch stammen", sourcesBack: "Zurück zur Startseite", sourcesEmpty: "Noch keine Quellen hinzugefügt.",sourcesCount: "{count} Quellen" },
            ar: { tagline: "كتاب البرهان", goTo: "الانتقال إلى:", go: "اذهب", previous: "السابق", next: "التالي", share: "مشاركة", copied: "تم نسخ الرابط!", notFound: "المرجع غير موجود! استخدم الصيغة الفصل:الصفحة (مثال 1:2 أو 2:1)", homeText: "كتاب إسلامي يستعرض الأدلة والحجج على صحة العقيدة. تصفح الفصول من القائمة، أو اضغط على \"ابدأ القراءة\" للبدء من الصفحة الأولى.", homeBtn: "ابدأ القراءة", searchPlaceholder: "ابحث عن كلمة أو فصل...", noResults: "لم يتم العثور على نتائج.", chapterMatch: "تطابق الفصل:", byAuthor: "بقلم", tableOfContents: "جدول المحتويات", sourcesTitle: "المصادر", sourcesTagline: "من أين تأتي المعلومات الواردة في هذا الكتاب", sourcesBack: "العودة إلى الصفحة الرئيسية", sourcesEmpty: "لم تتم إضافة مصادر بعد.", sourcesCount: "{count} مرجع" }
        };

        function applyUILanguage() {
            const t = uiStrings[uiLang] || uiStrings.en;
            document.getElementById('tagline-text').innerText = t.tagline;
            document.getElementById('goto-label').innerText = t.goTo;
            document.getElementById('go-btn').innerText = t.go;
            document.getElementById('prev-btn').innerText = t.previous;
            document.getElementById('next-btn').innerText = t.next;
            document.getElementById('home-tagline-text').innerText = t.tagline;
            document.getElementById('home-text').innerText = t.homeText;
            document.getElementById('home-start-btn').innerText = t.homeBtn;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            document.getElementById('sources-title-text').innerText = t.sourcesTitle;
            document.getElementById('sources-tagline-text').innerText = t.sourcesTagline;
            document.getElementById('sources-back-btn').innerText = t.sourcesBack;
        }

        function renderPage() {
            const chapter = bookData[currentChapter];
            const passage = chapter.pages[currentPage];

            document.getElementById('current-title').innerText = chapter.title;
            
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div class="chapter-header">
                    <h2>${chapter.title}</h2>
                    <p class="basmala">﷽</p>
                </div>
                <div class="passage">
                    <span class="passage-ref">${currentChapter}:${currentPage}</span>
                    <div class="passage-text">
                        <p class="passage-ar">${toArabicDigits(passage.ar)}</p>
                        <p class="passage-en">${getTranslationText(passage)}</p>
                    </div>
                </div>
            `;

            document.getElementById('page-display').innerText = `${currentChapter}:${currentPage}`;
            updateHashSilently(currentChapter, currentPage);

            const buttons = document.querySelectorAll('.chapter-list button');
            buttons.forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === currentChapter);
            });

            const totalPages = Object.keys(chapter.pages).length;
            document.getElementById('prev-btn').disabled = (currentPage === 1 && currentChapter === 1);
            document.getElementById('next-btn').disabled = (currentPage === totalPages && !bookData[currentChapter + 1]);
        }

        function loadChapter(chapNum) {
            if (bookData[chapNum]) {
                currentChapter = chapNum;
                currentPage = 1;
                showReaderView();
                renderPage();
            }
        }

        function nextPage() {
            const totalPages = Object.keys(bookData[currentChapter].pages).length;
            if (currentPage < totalPages) {
                currentPage++;
            } else if (bookData[currentChapter + 1]) {
                currentChapter++;
                currentPage = 1;
            }
            renderPage();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
            } else if (currentChapter > 1) {
                currentChapter--;
                currentPage = Object.keys(bookData[currentChapter].pages).length;
            }
            renderPage();
        }

        function jumpToReference() {
            const val = document.getElementById('jump-input').value.trim();
            const parts = val.split(':');
            
            if (parts.length === 2) {
                const chap = parseInt(parts[0]);
                const pg = parseInt(parts[1]);

                if (bookData[chap] && bookData[chap].pages[pg] && bookData[chap].pages[pg].en) {
                    currentChapter = chap;
                    currentPage = pg;
                    renderPage();
                    document.getElementById('jump-input').value = '';
                    return;
                }
            }
            alert((uiStrings[uiLang] || uiStrings.en).notFound);
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function makeSnippet(text, query) {
            const lowerText = text.toLowerCase();
            const idx = lowerText.indexOf(query);
            const start = Math.max(0, idx - 40);
            const end = Math.min(text.length, idx + query.length + 40);
            let snippet = text.substring(start, end);
            if (start > 0) snippet = '...' + snippet;
            if (end < text.length) snippet = snippet + '...';
            const regex = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
            return snippet.replace(regex, '<mark>$1</mark>');
        }

        function performSearch() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('search-results');

            if (!query) {
                resultsContainer.classList.add('hidden');
                resultsContainer.innerHTML = '';
                return;
            }

            const matches = [];
            const langs = [userLang, 'en', 'ar', 'tr', 'de'].filter((lang, idx, arr) => arr.indexOf(lang) === idx);

            Object.keys(bookData).forEach(function(chapNum) {
                const chapter = bookData[chapNum];

                if (chapter.title.toLowerCase().includes(query)) {
                    const t = uiStrings[uiLang] || uiStrings.en;
                    matches.push({
                        chapter: chapNum,
                        page: 1,
                        snippet: '<strong>' + t.chapterMatch + '</strong> ' + chapter.title
                    });
                }

                Object.keys(chapter.pages).forEach(function(pgNum) {
                    const passage = chapter.pages[pgNum];
                    for (let i = 0; i < langs.length; i++) {
                        const text = passage[langs[i]];
                        if (text && text.toLowerCase().includes(query)) {
                            matches.push({
                                chapter: chapNum,
                                page: pgNum,
                                snippet: makeSnippet(text, query)
                            });
                            break;
                        }
                    }
                });
            });

            if (matches.length === 0) {
                const t = uiStrings[uiLang] || uiStrings.en;
                resultsContainer.innerHTML = '<p class="search-no-results">' + t.noResults + '</p>';
                resultsContainer.classList.remove('hidden');
                return;
            }

            let html = '';
            matches.forEach(function(m) {
                const chapterTitle = bookData[m.chapter].title;
                html += `
                    <div class="search-result-item" onclick="goToSearchResult(${m.chapter}, ${m.page})">
                        <span class="search-result-ref">${m.chapter}:${m.page}</span>
                        <span class="search-result-chapter">${chapterTitle}</span>
                        <p class="search-result-snippet">${m.snippet}</p>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
            resultsContainer.classList.remove('hidden');
        }

        function goToSearchResult(chap, page) {
            currentChapter = chap;
            currentPage = page;
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').classList.add('hidden');
            document.getElementById('search-results').innerHTML = '';
            showReaderView();
            renderPage();
        }

        function showHomePage() {
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('reader-view').classList.add('hidden');
            document.getElementById('sources-page').classList.add('hidden');
            document.querySelectorAll('.chapter-list button').forEach(function(btn) {
                btn.classList.remove('active');
            });
        }

        function showReaderView() {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('reader-view').classList.remove('hidden');
            document.getElementById('sources-page').classList.add('hidden');
        }

        function startReading() {
            currentChapter = 1;
            currentPage = 1;
            showReaderView();
            renderPage();
        }

        applyUILanguage();
        if (location.hash.replace('#', '') === 'source') {
            showSourcesPage();
        } else if (loadFromHash()) {
            showReaderView();
            renderPage();
        } else {
            showHomePage();
        }
        window.addEventListener('hashchange', function() {
            if (location.hash.replace('#', '') === 'source') {
                showSourcesPage();
            } else if (loadFromHash()) {
                showReaderView();
                renderPage();
            } else if (!location.hash) {
                showHomePage();
            }
        });
    </script>
</body>
</html>
